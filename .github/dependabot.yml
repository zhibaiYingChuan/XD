# 依赖更新（P1-20）
#
# 为什么要开 dependabot：本项目的三条依赖链（Python 引擎 / 前端 / Rust 壳）
# 都直接决定产物里有什么。没有自动化更新时，唯一的升级触发是"某个漏洞
# 被公开报道"—— 那已经太晚了。
#
# ★ 策略：只开安全与补丁级别的小步更新，major 一律人工评估。
#   引擎是 Nuitka 冻结的，major 升级会改变构建行为，不适合自动合并。

version: 2

updates:
  # Python 引擎（pyproject.toml / setup.py 在仓库根）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # major 一律人工评估：引擎是 Nuitka 冻结的，大版本会改变构建行为
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 前端（Tauri 的 webview 侧）
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # major 一律人工评估：React 19 / Router 7 / Vite 8 这类升级必须集中做并回归
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Rust 壳
  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
    ignore:
      # major 一律人工评估：tauri / reqwest 这类大版本会改变运行时行为
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 本身也是依赖：action 被投毒等于发布链被接管。
  # ★ 这里只做"发现新版"，实际合入仍需把 SHA 钉死（见 ci.yml / release.yml）。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # major 一律人工评估：action 大版本常伴随输入参数变更，需同步改工作流
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
