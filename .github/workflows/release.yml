# SPDX-License-Identifier: DaoTi-Research-1.0
# 个人版发布流水线
#
# 为什么这个文件必须公开
# ────────────────────────────────────────────────────────────
# GitHub 只从 .github/workflows/ 读流水线。没有它就没有线上构建，
# 所以它不能跟 tests/ 一起移出仓库。
# 它只做构建与公钥断言（检查私钥有没有漏进仓库），
# 不含任何检测判据或攻击样本 —— 这与 tests/ 有本质区别。
#
# 个人版特有的门禁：激活码公钥。
# 缺公钥的包能启动、能显示界面、能跑通全部自检，
# 唯独每一个用户都激活不了 —— 发布后才发现等于白发一个版本。
# 那正是「静默降级」最典型的形态，所以这里必须在构建期拦死。
#
# 三平台构建的坑：**打包器不能交叉编译**。
# 它调用的是本机工具链（PyInstaller 打本机解释器的包，Nuitka 更直接
# 调本机 C 编译器），所以三个平台必须各自在对应 runner 上打包引擎，
# 而不是编一份再分发。
#
# ★ 2026-10-30：引擎打包器由 Nuitka 换成 PyInstaller。
#   原因不是「PyInstaller 更好」，而是 Nuitka 在 Linux 上要 13~14 分钟，
#   正好落在 GitHub 免费 ubuntu runner 被回收的窗口里 —— v0.1.28
#   连续 6 轮死在同一处，日志都是 `The runner has received a shutdown
#   signal`。PyInstaller 同规模约 2 分钟。回退开关：build_engine.py
#   --builder=nuitka。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # 门禁：发布前的能力与密钥自检
  # ══════════════════════════════════════════════════════════
  preflight:
    name: Preflight Gate
    runs-on: ubuntu-22.04
    steps:
      # ★ P1-26：本 job 的依赖面只有「取仓库 + pip」，allowlist 可核准，
      #   因此出网策略用 block（audit 只记录不拦截，等于事后才看得见）。
      #   build job 也已按同样方式收紧为 block，允许清单按步骤逐个列出，
      #   见该 job 的注释。
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          # ★★ 2026-10-30：关闭遥测上报。实测在 egress-policy: block 下，
          #   它的 post 收尾要联网上报，却被自己的出网策略挡住而不返回 ——
          #   有一轮 Post Harden Runner 卡了 53 分钟，把整条发布流水线拖死
          #   （后续 job 全在等它）。我们只用它的出网拦截能力，不需要云端分析。
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # ★ 发版前的版本一致性门禁（唯一真实来源：Cargo.toml）
      - name: Assert version consistency
        run: python .github/scripts/sync_version.py --check

      # ★★ 护栏必须在构建期就在位。
      #   护栏的 import 是延迟 import，Nuitka 静态分析看不到；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= 本 runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。
      #   这道门禁就是为拦住它存在的，必须在 CI 里跑。
      # ★★ 2026-10-29（第三轮审查 P0-2）：这一步只验**源码在位**，
      #   不能声称「已编入产物」—— 产物要等 build 之后才存在，
      #   而原来这句 PASS 文案出现在构建**之前**，给了人错误的安全感。
      #   产物级的护栏断言在 build job 的
      #   「Assert guardrail is present in compiled engine」。
      - name: Assert guardrail source is present
        run: |
          set -euo pipefail
          python -m pytest tests/test_guardrail_in_build.py -q --no-header -p no:cacheprovider
          echo "PASS：护栏层源码在位（产物校验在 build 阶段按二进制符号执行）"

      # ★★ 误报率必须在**发布前**这一层也验一次。
      #   分支 CI（ci.yml）只挂在 push/PR 上，tag 触发不到它 ——
      #   于是「分支上绿了、发版时不再验」是个真实缺口：
      #   偏偏被发出去的那一版没跑过误报门禁。
      #   本门禁拉起真实引擎进程 + 本地假上游，balanced/strict 两档
      #   各验「正常内容不误拦」与「真敏感不外泄」。
      - name: Assert no false positives (end-to-end)
        run: |
          set -euo pipefail
          python -m pytest tests/test_false_positive_e2e.py -q --no-header -p no:cacheprovider
          echo "PASS：误报率端到端门禁通过（均衡/严格两档）"

      # ★ 私钥绝不能出现在仓库里。
      #   一旦入库，任何人都能签发激活码，授权体系瞬间失效，
      #   且 Git 历史无法真正清除（后续删除，commit 里仍在）。
      #
      # ★ P1-24：判据从「文件名含 private」升级为「按内容特征」。
      #   旧写法漏掉 id_rsa / *.p12 / *.pfx / *.key，也漏掉
      #   把 PEM 粘进 README、issue 模板、测试夹具里的情况 ——
      #   而那几种恰恰是最容易发生的。
      #   判据与实现都在 .github/scripts/scan_secrets.py，可本地跑通再推。
      - name: Assert no private key material is tracked
        run: python .github/scripts/scan_secrets.py

      # 公钥必须在（build_engine.py 打包时要读它）
      # ★ 位置随 tools/ 移出而变更：公钥现在随包分发，放在包内。
      - name: Assert public key is present
        run: |
          set -euo pipefail
          PUB=src/daoti_xuandun_personal/license_pub.pem
          test -f "$PUB" \
            || { echo "::error::公钥缺失，干净 clone 上无法构建"; exit 1; }
          grep -q "BEGIN PUBLIC KEY" "$PUB" \
            || { echo "::error::公钥内容不是有效 PEM"; exit 1; }
          echo "PASS：公钥已入库且格式正确"

  build:
    name: Build (${{ matrix.art }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # ★ 每项都带一个紧凑 id（如 win-x64），专供 artifact 命名。
          #   不能用 matrix.name —— 里面有空格（"Windows x64"），
          #   也不能用 matrix.target —— Linux 的 deb 与 AppImage
          #   两个 job 的 target 完全相同，artifact 名字会撞，
          #   upload-artifact 直接失败。
          - os: windows-latest
            name: Windows x64
            art: win-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundle_glob: '*.exe'
          - os: macos-14
            name: macOS arm64
            art: mac-arm64
            target: aarch64-apple-darwin
            # ★ 显式带上 app：updater 的 mac 更新包是 .app.tar.gz（不是 dmg）
            bundle: app,dmg
            bundle_glob: '*.dmg'
          # ★★ 2026-10-30：Linux 两个包已从矩阵中移出，改为
          #   linux-engine → linux-deb / linux-appimage 三个独立 job。
          #   理由与 AppImage 同源，但更彻底：
          #
          #     Nuitka 编译引擎一项就要 10.6~14.3 分钟，而免费的
          #     ubuntu runner 在这段时间里被回收的概率很高
          #     （v0.1.28 五轮里 Linux 侧失败 5 次，日志统一是
          #      `The runner has received a shutdown signal`）。
          #
          #     把「编译引擎」单独成一个 job 有两个好处：
          #       ① 它成功结束 → ccache 与 cargo 缓存才存得下来；
          #          缓存存不下来，下一轮又是冷启动，永远追不上窗口；
          #       ② deb / AppImage 各自只做打包（5 / 8 分钟），
          #          即使其中一个被回收，另一个的产物仍在。
          #
          #   代价：Linux 三个 job 串行，最后出包时间比矩阵并行晚；
          #   但总时长仍由 win-x64 决定，不影响整轮完成时间。

          # ★★ 2026-10-30：AppImage 已从矩阵中移出，改为独立的 linux-appimage
          #   job（见 build 之后）。原因是一个被数据反复证实的结构问题：
          #
          #     AppImage 的 job 要把整条链跑两遍里最贵的那一段 ——
          #     Nuitka 编译引擎（10.6~14.3 分钟）+ Tauri 打包（6~8 分钟），
          #     总时长 16~21 分钟。而免费 runner 在这个区间里被回收的概率
          #     极高：v0.1.28 连续 4 轮分别在 9.8 / 10.9 / 12.4 / 16.4 分钟
          #     处被 cancelled，日志统一是
          #     「The runner has received a shutdown signal」。
          #
          #     同一个引擎，linux-deb 已经编译好了 —— AppImage 再编译一遍
          #     纯属重复劳动，而重复的那 10 分钟正是被回收的窗口。
          #
          #   ★ 现在 AppImage 只做「下载 deb job 编好的引擎 + linuxdeploy 打包」，
          #     约 8 分钟，稳定落在窗口内。
          #   ★ 代价：AppImage 必须等 build 矩阵整体完成（含 win-x64 的 ~29 分钟），
          #     发布总时长会比以前长。正确性优先于总时长 —— 出不了包，
          #     再快也没有意义。

    runs-on: ${{ matrix.os }}

    # ★ 矩阵项里已没有 allow_failure 项（AppImage 已独立成 job），
    #   因此这里恒为 false —— 保留表达式是为了让「谁允许失败」
    #   仍然写在 job 级，而不是散落在各步骤里。
    #   AppImage 的放行见 linux-appimage 自己的 continue-on-error。
    continue-on-error: ${{ matrix.allow_failure || false }}

    # ★★ 整个 job 强制 UTF-8。
    #   windows-latest 的控制台编码是 GBK（cp936），
    #   任何中文提示里的「→」「★」都会让 print 抛
    #   UnicodeEncodeError: 'charmap' codec can't encode characters
    #   把构建打断 —— 表面看是「Build Nuitka engine 退出码 1」，
    #   真实原因却与编译毫无关系，极难定位。
    #   在 job 级设置，Nuitka 等子进程也会继承。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      # ★ P1-26：出网从 audit 收紧为 block，并给出可核准的允许清单。
      #   audit 只记录、不拦截 —— 意味着构建期任何一个被投毒的依赖都能
      #   悄悄把数据或载荷发出去，而门禁本身「全部通过」。
      #
      #   这份清单按**步骤实际需要的域名**逐条列出，不做通配放开：
      #     · 取源码 / actions / 产物上传：github.com、codeload、
      #       objects/release-assets.githubusercontent、uploads.github.com
      #     · Python：pypi.org + files.pythonhosted.org（Nuitka 已禁用
      #       ccache 下载，不再需要 nuitka.net）
      #     · 前端：registry.npmjs.org；Rust：index/static.crates.io、
      #       static.rust-lang.org、sh.rustup.rs
      #     · Linux 打包：apt 源（deb 与 AppImage 的系统库）
      #     · Windows 签名：时间戳服务 timestamp.digicert.com
      #     · Windows 引擎编译：dependencywalker.com（Nuitka standalone 的
      #       Dependency Walker，由下面对应的预置步骤按固定 URL 下载并
      #       校验 SHA-256，构建期本身不再触网）
      #
      #   ★ 如果第一轮被拦：harden-runner 会在日志里逐条列出被阻断的
      #     `host:port`，把它补进下面这张表即可 —— 这比"全放开再看日志"
      #     更安全，因为默认是拒绝而不是允许。
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          # ★★ 2026-10-30：关闭遥测上报。实测在 egress-policy: block 下，
          #   它的 post 收尾要联网上报，却被自己的出网策略挡住而不返回 ——
          #   有一轮 Post Harden Runner 卡了 53 分钟，把整条发布流水线拖死
          #   （后续 job 全在等它）。我们只用它的出网拦截能力，不需要云端分析。
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            dependencywalker.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443
            nodejs.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            static.rust-lang.org:443
            sh.rustup.rs:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            esm.ubuntu.com:80
            esm.ubuntu.com:443
            timestamp.digicert.com:443

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          # ★ 2026-10-30：pip 此前没有任何缓存，每个 tag 都要重装
          #   nuitka + fastapi/uvicorn/httpx/pydantic + 本项目。
          #   构建链每缩短一分钟，runner 被回收的暴露窗口就少一分钟。
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # ★ 各平台用该平台的 Rust 工具链。macOS runner 是 arm64，
      #   显式指定 aarch64-apple-darwin 而不用默认工具链，
      #   否则会按 x86_64 交叉编译，产物在 M 系列机器上跑不起来。
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # ★★ 2026-10-30：Rust 依赖缓存（此前完全没有）。
      #
      #   win-x64 的 job 总耗时 29.8 分钟，大头是**每次从零编译全部
      #   crate**（Tauri + 上百个传递依赖）。每个 tag 都在重复同一份
      #   编译，而 job 越长，中途被免费 runner 回收的概率越高 ——
      #   Linux AppImage 已连续 4 轮在 10 分钟处被砍。
      #
      #   用官方 actions/cache 而不是第三方 rust-cache：少一个第三方
      #   依赖，缓存内容与命中行为都可审计（构建链路上的第三方越少越好）。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          # key 只随 Cargo.lock 变化：依赖没变就能复用已编译产物；
          # 依赖一改 key 就变，避免拿到过期产物。
          key: cargo-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.target }}-

      # Linux 打包 AppImage 需要这些系统库。
      # 缺 libwebkit2gtk 会报 "Required library 'webkit2gtk-4.1' not found"。
      #
      # ★ APPIMAGE_EXTRACT_AND_RUN=1 是**必须**的，不是优化：
      #   AppImage 运行时必须用 FUSE 把自身挂载出来才能执行，
      #   而 GitHub 的 ubuntu runner 跑在容器里，/dev/fuse 不可用
      #   （典型报错 "failed to run linuxdeploy" —— linuxdeploy 本身
      #   是个 AppImage，它挂载不上去就直接死给你看）。
      #   这个变量让它改成「解包到临时目录再运行」，绕开 FUSE。
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      # ★ 2026-10-30：ccache 缓存步骤已随 Nuitka 一起移除。
      #   PyInstaller 不做 C 编译，这段缓存没有任何内容可存；
      #   保留只会让每次构建多一次注定 miss 的缓存查询。
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # ★ 钉死打包器版本：版本漂移会改变产物布局与依赖收集结果。
          #   ★ 2026-10-30：从 Nuitka 换成 PyInstaller —— Nuitka 要把每个
          #   模块编译成 C 再编译成机器码，Linux 上一次 13~14 分钟，
          #   正好落在免费 runner 被回收的窗口里（连续 6 轮失败）。
          #   PyInstaller 只做打包与字节码归档，同规模约 2 分钟。
          pip install "pyinstaller==6.11.1"
          pip install -e .

      # ★★ UTF-8 输出自检 —— 在**真实 runner 环境**里验证。
      #   这条不是多余：Windows runner 默认 GBK，中文里的「→」「★」
      #   会让 print 抛 UnicodeEncodeError，把构建打断成
      #   「Build Nuitka engine 退出码 1」，而真实原因与编译无关。
      #   在这里先跑一次同样的输出，编码有问题就会立刻暴露，
      #   而不是等十分钟后从 Nuitka 失败里反推。
      #
      #   用 shell: bash 是刻意的 —— GitHub 默认的 pwsh 也会走 UTF-8，
      #   反而复现不出 GBK 环境；bash + 无 PYTHONIOENCODING 才接近
      #   runner 的默认状态。
      - name: Verify UTF-8 output
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          print("编码自检：护栏层已就位 → 将编入 ★")
          sys.stderr.write("[FATAL] 找不到护栏层源码，构建中止。\n")
          enc = (sys.stdout.encoding or "").lower().replace("-", "")
          print(f"stdout 编码 = {sys.stdout.encoding}")
          if enc not in ("utf8", "cp65001"):
              print(f"::error::stdout 编码是 {sys.stdout.encoding}，不是 UTF-8")
              sys.exit(1)
          PY
          echo "PASS：UTF-8 输出正常"

      # ★★ 2026-10-30：Dependency Walker 预置步骤已删除。
      #   它当初存在，是因为 Nuitka 的 --standalone 在 Windows 上必须靠
      #   depends.exe 解析 DLL 依赖。换成 PyInstaller 后不再需要 ——
      #   少一次第三方下载、少一个出网白名单条目、少一处可能失效的
      #   固定 SHA 校验。
      #
      # ★ 两个打包器都必须在目标平台本机跑（调用本机链接器 / 打包器），
      #   不能交叉编译 —— 所以仍是三个 runner 各自构建，不是编三份。
      - name: Build engine
        working-directory: desktop
        # 缺公钥时该脚本 return 4 —— 这里不做绕过。
        # 公钥缺失就是发布阻断，不是可选项。
        run: python build_engine.py

      # ★★ 2026-10-30：把「产物真的能跑、护栏真的在」变成发布判据。
      #
      #   为什么要端到端跑一次，而不是继续 grep 二进制：
      #   PyInstaller 把纯 Python 模块压缩进 PYZ，类名不以明文出现在
      #   任何文件里 —— grep 判据会对好包恒假。而本地实测过更糟的形态：
      #   numpy._core 漏收时，产物照样启动、/health 照常 ok，
      #   只有护栏导入失败 → 两层检测全空，界面却显示「防护中」。
      #   只有把进程拉起来问它自己，才能测出这件事。
      - name: Verify engine runtime (guardrail in place)
        working-directory: desktop
        run: python verify_engine_runtime.py

      # ══════════════════════════════════════════════════════════
      # 代码签名 · 引擎 sidecar（2026-10-27 新增）
      #
      # ★ 为什么必须在**打包之前**签：
      #   签名是对文件字节的摘要，签完再改就失效。引擎 exe 会被塞进
      #   安装包，所以只能先签它、再打包。反过来「打完包再签外层安装包」
      #   的话，里面那份引擎仍然是未签名的 —— 而用户装完之后，
      #   杀软实时监控扫到的恰恰就是那一份。
      #
      # ★ 未配置证书时**告警并跳过**，不阻断发布：
      #   证书采购是外部流程，卡住它等于卡住所有发布。
      #   但「跳过」必须在日志里说清楚，避免误以为已经签过了。
      # ══════════════════════════════════════════════════════════
      - name: Sign engine sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_PFX_B64:-}" ]; then
            echo "::warning title=本次产物未签名::WINDOWS_CERT_PFX_BASE64 未配置，引擎与安装包均为未签名产物。用户安装时被杀软拦截的概率显著升高。"
            exit 0
          fi
          # ★ P1-23：口令一律打码，避免被日志回显或后续步骤拼进输出。
          echo "::add-mask::$CERT_PASSWORD"
          # signtool 不在 PATH 上，按 SDK 版本取最新的那个
          SIGNTOOL=$(ls "C:/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::未找到 signtool.exe（Windows SDK 缺失）"
            exit 1
          fi
          PFX="$RUNNER_TEMP/codesign.pfx"
          echo "$CERT_PFX_B64" | base64 -d > "$PFX"
          shopt -s nullglob
          files=(desktop/src-tauri/resources/engine/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未找到待签名的引擎 exe"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "签名 $f"
            # ★ P1-23：signtool 只接受 /p <口令>，这一点绕不开；
            #   能做的三件事都做了：口令已 add-mask、PFX 与配置只存在于
            #   runner 临时目录、打包结束即删（见下方 Cleanup 步骤）。
            #   真正的原点是"证书只在一次性 runner 上落地"，不在本机。
            "$SIGNTOOL" sign /fd sha256 /f "$PFX" /p "$CERT_PASSWORD" \
              /tr http://timestamp.digicert.com /td sha256 "$f"
            "$SIGNTOOL" verify /pa /v "$f"
          done

          # ★ 生成一份**仅本次构建有效**的签名配置，交给 bundler。
          #   为什么要走 bundler 而不是打完包再补签：
          #     安装包里的应用主程序是 bundler 从 target/release 拷进去的。
          #     打完包再签外层安装包，里面那份主程序仍然未签名；
          #     用户在「已安装的应用」目录里被扫到的正是那一份。
          #   ★ 配置里含证书密码，所以只在 runner 的临时目录生成、
          #     并不进入仓库；PFX 也留到打包结束再删。
          #   ★ P1-23：口令经**环境变量**传入，不再出现在 python 的 argv 里
          #     （argv 会被进程列表看到，也会进崩溃转储）。
          SIGN_PFX="$PFX" SIGN_PWD="$CERT_PASSWORD" \
          SIGN_OUT="$RUNNER_TEMP/tauri.signing.conf.json" python - <<'PY'
          import json, os
          pfx = os.environ["SIGN_PFX"]
          pwd = os.environ["SIGN_PWD"]
          out = os.environ["SIGN_OUT"]
          cfg = {"bundle": {"windows": {"signCommand": {
              "cmd": "signtool",
              "args": [
                  "sign", "/fd", "sha256",
                  "/tr", "http://timestamp.digicert.com", "/td", "sha256",
                  "/f", pfx, "/p", pwd, "%1",
              ],
          }}}}
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, ensure_ascii=False)
          PY
          echo "TAURI_SIGN_CONFIG=$RUNNER_TEMP/tauri.signing.conf.json" >> "$GITHUB_ENV"

      # ★★ 引擎必须编入**本次构建时**的源码（2026-10-03 新增）
      #
      #   本地踩过的坑：改完 Python 源码后没有重新 build_engine，
      #   于是产物里是旧代码 —— 而「引擎文件时间晚于源码文件时间」
      #   看起来完全正常，检查通过了，装机后功能却是旧的。
      #
      #   症状极具误导性：装上去能启动、界面正常、
      #   只有「新加的那个接口」报 422 或404，
      #   而报错信息与「引擎是旧的」毫无关系。
      #
      #   判据：引擎产物的**构建指纹**必须指向本次构建的 commit。
      #   见下方 2026-10-07 说明 —— 换成指纹是因为
      #   「在二进制里 grep 关键字」这个判据本身不可靠。
      - name: Assert engine matches this build's commit
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=$(find desktop/src-tauri/resources/engine -name 'xuandun-engine-*' -type f -print -quit)
          if [ -z "$ENGINE" ]; then
            echo "::error::引擎产物不存在"
            exit 1
          fi
          echo "引擎：$ENGINE"

          # ★★ 2026-10-07：判据从「在二进制里 grep 关键字」换成
          #   「比对构建指纹里的 git SHA」。
          #
          #   旧判据在 mac-arm64 上**连续两次误报**，且每次标记都不同：
          #     ① 模块级函数名 `_derive_session_id` 被 Nuitka 内联优化，
          #        名字不再作为字符串存在于二进制；
          #     ② 改用字符串字面量后，短前缀 `sess-` 又被常量折叠吃掉 ——
          #        而同一次构建里 `.corrupt-`、`配置文件解析失败`、
          #        `dangerous_content` 全部在位，即代码确实已编入，
          #        门禁却报「编译的是旧源码」，白跑 30 分钟。
          #
          #   根因不是标记选得不好，而是**判据选错了**：某个关键字在不在
          #   完全由编译器优化策略支配，随平台与 Nuitka 版本漂移。
          #   拿它当门禁，只能一次次换标记，是打地鼠。
          #
          #   构建指纹（build_engine.py 产出）与编译器行为彻底解耦，
          #   且比关键字**更强** —— 它回答的是「产物对应哪个 commit」，
          #   而不是「大概像新代码」。没重新编译时，指纹里留着的是上一次
          #   的 SHA，比对必然不一致，恰好拦下它本来要拦的那件事，
          #   且不会因优化差异误报。
          STAMP=desktop/src-tauri/resources/engine/BUILD_INFO.json
          if [ ! -f "$STAMP" ]; then
            echo "::error::缺少构建指纹 BUILD_INFO.json —— 引擎未经 build_engine.py 构建"
            exit 1
          fi
          _read_stamp() {
            python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))[sys.argv[2]])" "$STAMP" "$1"
          }
          BUILT_SHA=$(_read_stamp git_sha)
          echo "指纹 commit: $BUILT_SHA"
          echo "本次 commit: $GITHUB_SHA"
          if [ "$BUILT_SHA" = "unknown" ]; then
            echo "::error::构建指纹里没有 commit（构建时取不到 git 信息）"
            exit 1
          fi
          if [ "$BUILT_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::引擎产物的 commit（$BUILT_SHA）与本次构建（$GITHUB_SHA）不一致 —— 编译的是旧源码，请重新运行 build_engine.py"
            exit 1
          fi
          # 指纹还须证明护栏层被编入：缺护栏 = 提示词注入与敏感泄露
          # 两层检测静默失效，而界面照常显示「防护中」。
          if [ "$(_read_stamp has_guardrail)" != "True" ]; then
            echo "::error::构建指纹显示护栏层未编入 —— 产物缺少提示词注入与敏感泄露检测"
            exit 1
          fi
          echo "PASS：引擎产物的 commit 与本次构建一致，且护栏层已编入"

      # ★★★ 产物级断言：本 workflow 存在的核心理由
      #
      #   前面所有检查都是「源码/配置对不对」，这两条是
      #   「**编译出来的二进制里到底还剩不剩交付能力**」。
      #
      #   公钥：build_engine.py 会拷公钥，但「脚本说拷了」不等于
      #   「真的拷了」。缺公钥的包能启动、能自检通过，唯独每个用户
      #   都激活不了 —— 发布后才发现等于白发一个版本。
      #
      #   护栏：import 是延迟 import，Nuitka 静态分析看不到它；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。用户以为自己受保护。
      #
      #   ★ 判据与实现都在 desktop/verify_guardrail_bundle.py，不内联在 YAML。
      #     内联脚本藏在 YAML 缩进与 heredoc 里，本机无从验证 ——
      #     2026-09-28 连续三轮栽在内联 Python 上（f-string 嵌套引号、
      #     set -u 下 unbound variable、Windows 相对路径），每一轮都要
      #     等十分钟的 CI 才暴露。独立文件可以本地跑通再推。
      #
      #   ★ 公钥判据：产物目录里确实有 license_pub.pem。
      #   ★ 护栏判据：在二进制里搜判据标识（system_prompt_inject /
      #     sensitive_leak）。不能找 .py 文件 —— Nuitka standalone 把
      #     模块编译进二进制，dist/ 下只剩 data 文件，源码根本不出现；
      #     也不能只看目录存在 —— 空壳目录同样满足，而它毫无防护能力。
      #     判据标识只由护栏代码产生，护栏缺失时必然搜不到。
      - name: Assert public key landed in bundle
        working-directory: desktop
        run: python verify_guardrail_bundle.py --pubkey-only

      # ★★ 2026-10-30：原来的「在二进制里 grep 护栏类名」已删除。
      #   PyInstaller 把纯 Python 模块压缩进 PYZ 归档，类名不以明文出现在
      #   任何文件里 —— 那条判据会对**好包**恒假，直接把发布拦死。
      #   真正更强的判据已在上一步：把产物拉起来，读 /api/state 的
      #   guardrail_missing_layers（见 desktop/verify_engine_runtime.py）。
      #   它不仅能测「模块在不在」，还能测「导不导得进来、服务起不起得来」。

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # ★ 私钥与公钥错配时，构建与发布都照常成功，但所有客户端
      #   下载更新后验签失败 —— 错误只在用户端出现。
      #   这里用一次真实签名比对 key id，发版前就能发现。
      #   只在 Windows job 跑一次（CLI 的密钥处理与平台无关）。
      - name: Assert updater signing key matches pubkey
        if: matrix.art == 'win-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python .github/scripts/check_signing_key.py

      # ★★ Linux AppImage 专用：把 numpy 自带的科学计算库链注册进系统库路径。
      #
      #   2026-09-29 从 v0.1.0-alpha16 的 --verbose 日志读出的**真实机制**：
      #
      #     Deploying dependencies for ELF file .../engine/numpy/_core/_multiarray_umath.so
      #     ERROR: Could not find dependency: libgfortran-040039e1-0352e75f.so.5.0.0
      #     ERROR: Failed to deploy dependencies for existing files
      #
      #   linuxdeploy 逐个 ELF 解析 DT_NEEDED，只在两类位置找依赖：
      #     ① 引用方**自己所在的目录**
      #     ② 系统库路径（即 ldconfig 的搜索列表）
      #
      #   ★★ 关键：要注册的是**整条传递依赖链**，不止 OpenBLAS 一个。
      #
      #     依赖关系（全部来自同一份日志，可逐条验证）：
      #       numpy/_core/_multiarray_umath.so
      #         └─ libscipy_openblas64_-32a4b2a6.so   （在 engine/ 根部）
      #              └─ libgfortran-040039e1-*.so.5.0.0  ← 缺的就是它
      #                   └─ libquadmath-96973f99-*.so.0.0.0
      #
      #     之前的版本只注册了 OpenBLAS。日志显示它确实生效了
      #     （ldconfig 匹配项数=1，linuxdeploy 也成功部署了它
      #     和它的依赖 libgfortran），
      #     但**下一层**的 libgfortran 引用方在 numpy/_core/，
      #     自己在 engine/ 根部 —— ①那条路覆盖不到，
      #     而它从未进过系统库索引，②也覆盖不到 → 整包失败。
      #
      #     所以这里把 libgfortran / libquadmath 一并注册，
      #     覆盖到链条的每一环。
      #
      #   ★ 这不是「绕过依赖检查」：注册之后 linuxdeploy 依然按它自己的
      #     规则解析并部署这些库，产出的 AppImage 与 deb 运行时行为一致。
      #   ★ 单个库找不到不失败：整批尽力而为，产物能否打出由
      #     后面的打包结果决定（失败也已被降级为警告）。
      - name: Register numpy native libs for linuxdeploy
        # ★ 2026-10-30：AppImage 已独立成 job，这里恒不执行 ——
        #   等价逻辑随它一起搬到了 linux-appimage。
        #   保留原地是为了让「为什么 AppImage 需要注册这些库」的
        #   来龙去脉留在它最初出现的地方；真正生效的实现见
        #   linux-appimage → Register numpy native libs for linuxdeploy。
        if: matrix.allow_failure
        shell: bash
        working-directory: desktop
        run: |
          set -uo pipefail
          # ★ 三类都要：OpenBLAS 本身 + 它的两个下游。
          #   少注册任何一个，linuxdeploy 都会在下一层报
          #   "Could not find dependency"，而那个报错出现在
          #   几万行日志末尾，很容易被误读成别的原因。
          missing=0
          for pat in 'libscipy_openblas64*.so*' 'libgfortran*.so*' 'libquadmath*.so*'; do
            lib="$(find src-tauri/resources/engine -name "$pat" -type f -print -quit)"
            if [ -z "$lib" ]; then
              echo "::warning::引擎产物里没有 $pat"
              missing=$((missing + 1))
              continue
            fi
            echo "注册：$(basename "$lib")"
            sudo cp -v "$lib" /usr/lib/x86_64-linux-gnu/
          done
          sudo ldconfig
          echo "---- 注册后系统库索引核对 ----"
          for pat in scipy_openblas gfortran quadmath; do
            echo "  $pat → $(ldconfig -p | grep -c "$pat" || true) 项"
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::有 $missing 类库未找到，AppImage 可能仍会因依赖缺失而失败（deb 不受影响）。"
          fi
          exit 0

      - name: Build Tauri app
        working-directory: desktop
        env:
          # ★ 2026-10-29：tauri.conf.json 已开启 createUpdaterArtifacts，
          #   没有私钥时 `tauri build` 会直接失败 —— 所以这两个 secret
          #   从「可选」变成「发布必需」，缺失即整轮红。
          #   本地构建同样需要注入私钥（见 docs/DEVELOPMENT.md）。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # ★ 必须显式指定 --bundles，且传的是**格式名**（nsis/dmg/deb/appimage）
        #   而不是通配符 —— 命令行不接受 glob。
        #   各平台只能构建自己支持的格式，传 all 会让 macOS runner
        #   尝试产出 .exe 而失败。
        #
        # ★ 这里不再设 APPIMAGE_EXTRACT_AND_RUN / NO_STRIP。
        #   2026-09-28 曾先后加上这两个变量，各花一轮 17 分钟的 CI，
        #   两次都与真实故障无关：
        #     · APPIMAGE_EXTRACT_AND_RUN —— Tauri 自己就设了这个环境变量
        #       并传了 --appimage-extract-and-run（见 tauri-bundler 的
        #       appimage/linuxdeploy.rs），我们设的是重复的。
        #     · NO_STRIP —— 试的是「strip 失败」这个假设，未被证实。
        #   真实原因是 linuxdeploy 解析 DT_NEEDED 时找不到 numpy 的
        #   libscipy_openblas64_*.so（见上一步 Register numpy OpenBLAS）。
        #   ★ 曾把根因记成「由 build_engine.py 平铺 .so 解决」—— 那是
        #     误判：平铺是把该库放到引擎根部，而引用方在 numpy/_core/，
        #     目录不同，linuxdeploy 照样找不到。已按日志更正。
        #
        # ★ --verbose 保留：它让 linuxdeploy 的真实报错出现在日志里。
        #   没有它，Tauri 只给一句 "failed to run linuxdeploy"，
        #   FUSE / strip / 依赖缺失三种故障长得一模一样。
        #   一次构建 17 分钟，看不见原因等于盲飞 —— 这正是本次
        #   连续两轮误判的直接原因。
        #
        # ★ 失败处理：AppImage 是 continue-on-error 的可选产物，
        #   「job 标红」会让整轮 CI 带上一个 error 注解，观感等同
        #   「构建坏了」—— 而 deb / Windows / macOS 三个包其实都好好的。
        #   故这里把该矩阵项的失败**显式降级为 warning**：
        #   信息仍留在日志与注解里，但不再把整轮结果染红。
        #   非 AppImage 的矩阵项照旧 exit 1，失败仍会阻断发布。
        # ★ 必须显式声明 shell: bash —— 本段是 bash 语法（if/then/fi、[ "$X" = ... ]）。
        #   不声明时 GitHub 按 runner 的**默认 shell** 执行：macOS/Linux 是 bash，
        #   但 **Windows 是 pwsh**，而 pwsh 解析不了 bash 的 if 语句 ——
        #   v0.1.0-alpha12 的 Build (win-x64) 就是这么挂的：
        #     ParserError: ...ps1:2
        #     Missing '(' after 'if' in if statement.
        #   ★ 危险点：Linux/macOS 三个 job 全绿、只有 Windows 红，
        #     很容易被误读成「Windows 平台性问题」而往错的方向查。
        #     真实原因是 shell 选错了，与平台、代码都无关。
        shell: bash
        run: |
          # ★ 2026-10-29：createUpdaterArtifacts 已移入 tauri.conf.json ——
          #   Linux AppImage 只有开启它才会产出 `.AppImage.tar.gz`，
          #   而缺了那个包，`latest.json` 里就没有 linux-x86_64 条目，
          #   Linux 用户永远收不到自动更新。代价：本地 `tauri build`
          #   也必须注入签名私钥（docs/DEVELOPMENT.md 已写明）。
          #
          # ★ 这里的 --config 保留（与主配置同值，幂等）：
          #   「CI 会产出更新签名包」这个意图在流水线里仍应可见。
          #
          # ★ deb 不产出 updater 资产（Linux 自动更新走 AppImage），
          #   不给它加这个覆盖，避免 bundler 对不支持的格式报错。
          CONFIG_ARGS=""
          if [ "${{ matrix.art }}" != "linux-deb" ]; then
            CONFIG_ARGS="--config src-tauri/tauri.updater.conf.json"
          fi
          # ★ 有证书时，把签名配置也叠加上去（bundler 会用它签主程序与安装包）。
          #   该文件由「Sign engine sidecar」步骤在 runner 临时目录生成，
          #   未配置证书时这个变量为空，行为与之前完全一致。
          if [ -n "${TAURI_SIGN_CONFIG:-}" ]; then
            CONFIG_ARGS="$CONFIG_ARGS --config $TAURI_SIGN_CONFIG"
          fi
          # ★★ 2026-10-29（P0-9）：Linux runner 偶发被回收 —— job 在打包中途
          #   被 cancelled，日志里看不出任何代码/依赖原因。v0.1.27-alpha 的
          #   AppImage 第 4 次就是这么消失的。基础设施抖动重试一次即可。
          #   ★ 用自写循环而不是 nick-invision/retry：引入新 Action 就要再钉
          #     一个 40 位 SHA，而这条重试只需要「再跑一遍同一条命令」，
          #     自写更小的攻击面（不引入任何第三方代码）。
          #   ★ 矩阵项不声明 max_attempts 时只跑一次（Windows / macOS 不变）。
          MAX_ATTEMPTS='${{ matrix.max_attempts }}'
          [ -n "$MAX_ATTEMPTS" ] || MAX_ATTEMPTS=1
          attempt=0
          ok=0
          while [ "$attempt" -lt "$MAX_ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            echo "::group::tauri build 第 $attempt/$MAX_ATTEMPTS 次"
            if npm run tauri build -- --verbose --bundles ${{ matrix.bundle }} \
                 $CONFIG_ARGS; then
              ok=1
            fi
            echo "::endgroup::"
            [ "$ok" = "1" ] && break
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning title=打包失败，准备重试::第 $attempt/$MAX_ATTEMPTS 次 tauri build 失败，60s 后重试（Linux runner 偶发被回收，属基础设施问题）"
              sleep 60
            fi
          done
          if [ "$ok" = "1" ]; then
            exit 0
          fi
          if [ "${{ matrix.allow_failure }}" = "true" ]; then
            echo "::warning title=AppImage 打包失败（可选产物，不阻断发布）::linuxdeploy 未能完成打包，详见本步骤日志；deb 与 Windows/macOS 产物不受影响。缺件是否允许发布，由 release job 的「Assert every required asset is present」按 ALLOW_MISSING_APPIMAGE 判定。"
            exit 0
          fi
          exit 1

      # 签名收尾：确认安装包确实带上了签名，并清掉临时证书。
      # ★ 为什么要「验证」而不是「签完就信」：
      #   bundler 的 signCommand 失败时可能只是打印一行日志，
      #   产出一个未签名的安装包 —— 而发布流程会照常把它传上去。
      #   用户装那个包时才会发现自己被拦，而那时已经发出去了。
      - name: Verify installer signature (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CERT_PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_PFX_B64:-}" ]; then
            echo "::warning::未配置签名证书，跳过安装包签名校验"
            exit 0
          fi
          shopt -s nullglob
          files=(desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未找到安装包，无法校验签名"
            exit 1
          fi
          SIGNTOOL=$(ls "C:/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$SIGNTOOL" ]; then
            echo "::error::未找到 signtool.exe，无法校验安装包签名"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "校验 $f"
            "$SIGNTOOL" verify /pa /v "$f"
          done

      # ★ P1-23：证书与含口令的签名配置**无条件**清理（if: always）。
      #   原先的 rm 写在「校验签名」步骤末尾 —— 一旦校验失败就直接退出，
      #   临时证书留在 runner 上直到回收。清理不该依赖前一步的成功。
      - name: Cleanup signing material (Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/codesign.pfx" "$RUNNER_TEMP/tauri.signing.conf.json" || true
          echo "已清理临时证书与签名配置"

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # ★ 用 matrix.art 而不是 matrix.target 命名。
          #   Linux 的 deb 与 AppImage 是两个 job 但 target 相同
          #   （都是 x86_64-unknown-linux-gnu），artifact 名字冲突时
          #   upload-artifact 会直接失败 —— 而且报错与真实原因
          #   毫无关联，不容易联想到是命名撞了。
          name: xuandun-personal-${{ matrix.art }}
          # ★ 2026-10-20：除安装包外，还要带上 updater 资产：
          #   .exe.sig / .app.tar.gz(.sig)。
          #   少了 .sig，latest.json 就生成不出来，自动更新形同虚设。
          #
          # ★ 2026-10-21：tar.gz 必须限定成 `*.app.tar.gz`。
          #   原先写的是 `**/*.tar.gz`，把 deb 打包过程中的临时文件
          #   `bundle/deb/<包名>/control.tar.gz` 与 `data.tar.gz` 也收了进去，
          #   于是它们被当成发布资产传了上去（线上真的出现了这两坨）。
          #
          # ★ 2026-10-29：补 `**/*.AppImage.tar.gz` ——
          #   macOS 的通配是 `*.app.tar.gz`（小写 app），Linux 的更新包叫
          #   `*.AppImage.tar.gz`，两个通配互不覆盖。少了这一行，AppImage
          #   更新包在 build job 就被丢下，release job 里当然永远缺 Linux。
          path: |
            desktop/src-tauri/target/release/bundle/**/${{ matrix.bundle_glob }}
            desktop/src-tauri/target/release/bundle/**/*.sig
            desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz
          # ★ 非 AppImage 的矩阵项：没产出文件就是失败。
          #   包少一个而没人知道，比构建失败更糟。
          #
          # ★ AppImage 矩阵项：降为 warn。它已在上一步被显式降级
          #   （打包失败 → warning + exit 0），若这里仍要求 error，
          #   就会把同一个「可选产物没打出来」再报成一次失败，
          #   整轮 CI 又变回一个 error 注解 —— 等于降级没做。
          #   缺失信息已由那一条 warning 承载，不会静默消失。
          if-no-files-found: ${{ matrix.allow_failure && 'warn' || 'error' }}

  # ══════════════════════════════════════════════════════════
  # Linux 引擎编译（单独一个 job，只为「让缓存存得下来」）
  #
  # ★★ 为什么必须单独拆出来（2026-10-30）：
  #   `actions/cache` 只在 job **成功结束**时才写缓存。原先引擎编译与
  #   打包挤在同一个 job 里，总时长 13~16 分钟，被 runner 回收时
  #   ccache 与 cargo 缓存一起丢掉 —— 下一轮又是冷启动，永远追不上
  #   那个窗口。这是本轮连续失败真正的死循环。
  #   现在它只做一件事：把引擎编出来、上传、并让缓存落盘。
  #   成功一次之后，后面的构建就能命中缓存（Nuitka 3~4 分钟）。
  # ══════════════════════════════════════════════════════════
  linux-engine:
    name: Build engine (linux)
    needs: preflight
    # ★★ 不能换到 ubuntu-24.04（曾考虑过，已否决）：
    #   24.04 的 glibc 是 2.39，22.04 是 2.35。在 24.04 上编出来的
    #   引擎二进制会要求 glibc ≥ 2.39，而 Ubuntu 22.04 用户
    #   （以及 deb 的兼容下限）根本跑不起来 —— 包能装、启动即挂。
    #   Linux 产物必须在**最老的支持版本**上编，这是兼容性底线，
    #   不能为了「换个池子少被回收」牺牲它。
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      # ★★ 2026-10-30：Linux job 不再使用 harden-runner。
      #
      #   事实：它在 ubuntu runner 上的 post 收尾阶段两次卡死整条发布 ——
      #   一次 53 分钟（Preflight 一直不结束，后续 job 全在等），
      #   一次让 linux-engine 的日志都无法归档（BlobNotFound）。
      #   即使加了 disable-telemetry，block 模式下仍然复现。
      #
      #   取舍：本工作流只在 tag 推送时触发，只有仓库维护者能发版；
      #   依赖通过 pyproject / package-lock / Cargo.lock 精确锁定；
      #   产物还要过 VirusTotal 与缺件门禁。失去的是「构建期出网审计」
      #   这一层观测，换来的是发布不再被基础设施卡死。
      #   ★ 这不是理想状态：等 harden-runner 在 Linux 上稳定后再加回来。

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      # ★ 2026-10-30：ccache 与它的缓存步骤已删除。
      #   PyInstaller 不做 C 编译（Nuitka 才需要），装 ccache 只是
      #   多一次 apt 往返；而它当初存在的唯一理由就是给 Nuitka 加速。
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.11.1"
          pip install -e .

      - name: Build engine
        working-directory: desktop
        run: python build_engine.py

      # ★ 与 build job 同一道判据：拉起来问它自己，而不是 grep 二进制
      #   （PyInstaller 的模块在 PYZ 里压缩存放，grep 恒假）。
      - name: Verify engine runtime (guardrail in place)
        working-directory: desktop
        run: python verify_engine_runtime.py

      - name: Assert engine matches this build's commit
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=$(find desktop/src-tauri/resources/engine -name 'xuandun-engine-*' -type f -print -quit)
          test -n "$ENGINE" || { echo "::error::引擎产物不存在"; exit 1; }
          echo "引擎：$ENGINE"

      - name: Upload prebuilt engine
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-engine-linux
          path: desktop/src-tauri/resources/engine
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  # Linux deb（复用引擎，只打包）
  # ══════════════════════════════════════════════════════════
  linux-deb:
    name: Build (linux-deb)
    needs: linux-engine
    runs-on: ubuntu-22.04
    steps:
      # 同 linux-engine：harden-runner 在 ubuntu 上的 post 阶段会卡死发布，
      # 取舍与安全补偿见该 job 顶部的说明。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-

      - name: Install Linux bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Download prebuilt engine
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: xuandun-engine-linux
          path: desktop/src-tauri/resources/engine

      - name: Restore engine permissions
        shell: bash
        run: |
          set -euo pipefail
          DIR=desktop/src-tauri/resources/engine
          find "$DIR" -type f \( -name '*.bin' -o -name 'xuandun-engine-*' \) \
            -exec chmod +x {} \;
          echo "已恢复可执行位"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Assert updater signing key matches pubkey
        shell: bash
        run: python .github/scripts/check_signing_key.py

      - name: Build Tauri app (deb)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          attempt=0
          ok=0
          while [ "$attempt" -lt 2 ]; do
            attempt=$((attempt + 1))
            echo "::group::tauri build 第 $attempt/2 次"
            if npm run tauri build -- --verbose --bundles deb; then
              ok=1
            fi
            echo "::endgroup::"
            [ "$ok" = "1" ] && break
            [ "$attempt" -lt 2 ] && sleep 60
          done
          [ "$ok" = "1" ] || exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-personal-linux-deb
          path: |
            desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════
  # Linux AppImage（复用引擎，只做 linuxdeploy 打包）
  #
  # ★★ 为什么单独拆出来（2026-10-30，数据驱动）：
  #   AppImage 原先在 build 矩阵里，要把「Nuitka 编译引擎」整条走一遍，
  #   总时长 16~21 分钟。而免费 runner 在这个区间被回收的概率极高 ——
  #   v0.1.28 连续 4 轮分别死在 9.8 / 10.9 / 12.4 / 16.4 分钟，
  #   日志统一是 `The runner has received a shutdown signal`。
  #   同一个引擎 linux-deb 已经编好了，再编一遍纯属重复劳动，
  #   而那 10 分钟正是被回收的窗口。
  #
  #   现在它只做「下载引擎 + linuxdeploy 打包」，约 8 分钟。
  # ══════════════════════════════════════════════════════════
  linux-appimage:
    name: Build (linux-appimage)
    # ★ 与 deb 同源：都等 linux-engine 编好引擎，互不重复编译。
    needs: linux-engine
    # ★ 可选产物：失败不染红整轮。缺件的后果由 release job 的
    #   「Assert every required asset is present」显式判定 ——
    #   那才是唯一有资格说「这次可以缺件」的地方。
    continue-on-error: true
    runs-on: ubuntu-22.04
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      # 同 linux-engine：harden-runner 在 ubuntu 上的 post 阶段会卡死发布，
      # 取舍与安全补偿见该 job 顶部的说明。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      # ★ 与 build job 共用同一份 cargo 缓存：Rust 依赖只编一次，
      #   这里的 `tauri build` 才能真的只花「打包」那一小段。
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-x86_64-unknown-linux-gnu-

      - name: Install Linux bundling dependencies
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      # ★ 引擎直接取自 linux-deb job —— 同一个 commit、同一次构建。
      - name: Download prebuilt engine
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: xuandun-engine-linux
          path: desktop/src-tauri/resources/engine

      # ★ artifact 是 zip 打包的，**不保留可执行位** —— 下载后必须补。
      #   漏了这一步，Tauri 打出来的 AppImage 里 sidecar 不可执行，
      #   用户装完启动即失败，而打包过程一路绿。
      - name: Restore engine permissions
        shell: bash
        run: |
          set -euo pipefail
          DIR=desktop/src-tauri/resources/engine
          test -d "$DIR" || { echo "::error::引擎目录不存在"; exit 1; }
          find "$DIR" -type f \( -name '*.bin' -o -name 'xuandun-engine-*' \) \
            -exec chmod +x {} \;
          echo "已恢复可执行位："
          find "$DIR" -maxdepth 1 -type f -perm -u+x | head -5

      # ★ 仍然要证明「这份引擎是本次源码编出来的」。
      #   artifact 可能来自同一次 run 的另一个 job，但判据不能靠「应该是」——
      #   必须是能在二进制里读到的构建指纹。
      - name: Assert engine matches this build's commit
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=$(find desktop/src-tauri/resources/engine -name 'xuandun-engine-*' -type f -print -quit)
          test -n "$ENGINE" || { echo "::error::引擎产物不存在"; exit 1; }
          echo "引擎：$ENGINE"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Register numpy native libs for linuxdeploy
        shell: bash
        working-directory: desktop
        run: |
          set -uo pipefail
          missing=0
          for pat in 'libscipy_openblas64*.so*' 'libgfortran*.so*' 'libquadmath*.so*'; do
            lib="$(find src-tauri/resources/engine -name "$pat" -type f -print -quit)"
            if [ -z "$lib" ]; then
              echo "::warning::引擎产物里没有 $pat"
              missing=$((missing + 1))
              continue
            fi
            echo "注册：$(basename "$lib")"
            sudo cp -v "$lib" /usr/lib/x86_64-linux-gnu/
          done
          sudo ldconfig
          if [ "$missing" -gt 0 ]; then
            echo "::warning::有 $missing 类库未找到，AppImage 可能仍会因依赖缺失而失败。"
          fi
          exit 0

      - name: Build Tauri app (AppImage)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          attempt=0
          ok=0
          while [ "$attempt" -lt 2 ]; do
            attempt=$((attempt + 1))
            echo "::group::tauri build 第 $attempt/2 次"
            if npm run tauri build -- --verbose --bundles appimage \
                 --config src-tauri/tauri.updater.conf.json; then
              ok=1
            fi
            echo "::endgroup::"
            [ "$ok" = "1" ] && break
            [ "$attempt" -lt 2 ] && sleep 60
          done
          if [ "$ok" = "1" ]; then
            exit 0
          fi
          # ★ 可选产物：失败降级为 warning。缺件是否允许发布，
          #   由 release job 的缺件门禁按 ALLOW_MISSING_APPIMAGE 判定。
          echo "::warning title=AppImage 打包失败（可选产物，不阻断发布）::linuxdeploy 未能完成打包，详见日志；deb / Windows / macOS 不受影响。"
          exit 0

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-personal-linux-appimage
          path: |
            desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/src-tauri/target/release/bundle/**/*.sig
            desktop/src-tauri/target/release/bundle/**/*.AppImage.tar.gz
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # 门禁：杀软误报扫描（在 build 与 release 之间）
  #
  # ★ 为什么必须有：玄盾引擎是 Python 冻结出来的 exe，
  #   被国产杀软按启发式判毒是常态。用户看到报毒就会卸载，
  #   功能做得再好也没用。
  #
  # ★ 为什么 job 本身不写 if: secrets.X != ''：
  #   被 skip 的 need 会把 release 一起 skip 掉（GitHub 语义），
  #   「没配密钥」于是变成「发不出版」。所以 job 照常跑，
  #   由脚本内部判断——没密钥就打印跳过并退出 0。
  # ══════════════════════════════════════════════════════════
  virustotal:
    name: VirusTotal Scan
    # ★★ 2026-10-30：把两个 Linux 包纳入 needs —— 否则扫描会在它们
    #   还没产出时开始，扫不到 deb/AppImage，报告里少两行而没人发现。
    #   AppImage 带 continue-on-error（可选产物），所以判据不能再用
    #   success()：只有 build 与 linux-deb 必须成功，AppImage 缺席
    #   只意味着少一个待扫文件。
    needs: [build, linux-deb, linux-appimage]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.linux-deb.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install httpx
        run: pip install httpx

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      # 退出码 1 = 报毒超阈值 → 阻断发布。
      # 未配密钥 / VT 整体不可达时脚本自行跳过（退出 0）并打 warning。
      #
      # ★ 2026-10-29（P0-9）：**没有结论不得当通过**。
      #   超时（status != completed）或拿不到逐引擎结果时脚本返回 1，
      #   不再退回「按总数=0 判定通过」。确需跳过时设仓库变量
      #   VT_ALLOW_SKIP=1，脚本降级为 warning 并明确写出「本次未得到结论」。
      - name: Scan installers on VirusTotal
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_MAX_MALICIOUS: '3'
          VT_ALLOW_SKIP: ${{ vars.VT_ALLOW_SKIP }}
        run: |
          set -euo pipefail
          python .github/scripts/virustotal_scan.py artifacts

  release:
    name: Create Release
    # ★★ 2026-10-30：把 linux-appimage 纳入 needs —— 否则 release 会在
    #   AppImage 还没跑完时就装配资产，然后被缺件门禁判成「缺 AppImage」，
    #   而那个包其实几分钟后才到。
    #   它带 continue-on-error（可选产物），所以结论判断不能再用 success()：
    #   只要 build 与 virustotal 成功就继续，缺件由门禁按
    #   ALLOW_MISSING_APPIMAGE 显式裁决 —— 这与「静默放过」是两回事。
    # ★★ 2026-10-30：virustotal 现在聚合了 build / linux-deb / linux-appimage
    #   三个来源，release 只需等它 —— 重复列出会多一层失败传播面。
    needs: [build, virustotal]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.virustotal.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    # ★ P1-25：发布挂到 environment 上 —— 一旦仓库配置了必需审核人，
    #   发版就需要人工批准，而不是拿到 tag 推送权限就能直接发。
    #   未配置时等同于普通 job（GitHub 会自动创建同名 environment），
    #   不会阻断发布。
    environment: release
    permissions:
      contents: write
      # ★ P1-21：生成 SLSA 来源证明需要这两项。
      #   id-token 用于 OIDC 换取签名身份，attestations 用于写入证明存储。
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          # ★★ 2026-10-30：关闭遥测上报。实测在 egress-policy: block 下，
          #   它的 post 收尾要联网上报，却被自己的出网策略挡住而不返回 ——
          #   有一轮 Post Harden Runner 卡了 53 分钟，把整条发布流水线拖死
          #   （后续 job 全在等它）。我们只用它的出网拦截能力，不需要云端分析。
          disable-telemetry: true
          disable-sudo: true
          # ★ P1-26：本 job 的出网面可核准 —— GitHub API、产物下载、
          #   证明写入。不在这里 block，等于整条流水线只有审计没有拦截。
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.actions.githubusercontent.com:443
            # gh attestation verify 需要用 Sigstore 的信任根核验证明
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            *.sigstore.dev:443

      # ★ 2026-10-21：release job 里要跑 .github/scripts/make_latest_json.py，
      #   这个 job 之前**没有 checkout**，脚本根本不在工作目录里 ——
      #   四个平台全部构建成功、VirusTotal 也过了，却卡在最后一步。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      # ★ 2026-10-21：发布前统一改成 ASCII 文件名。
      #   GitHub 会**静默剥掉**资产名里的非 ASCII 字符：
      #   `道体·玄盾 个人版_0.1.18-alpha_x64-setup.exe`
      #   → `_0.1.18-alpha_x64-setup.exe`。
      #   而 latest.json 里写的是原始名（百分号编码），
      #   于是更新 URL 直接 404 —— 这是最坏的一种错：
      #   发版全绿、更新清单也在，只有客户端悄悄永远升不了级。
      #   与其去猜 GitHub 的裁剪规则，不如自己先定成 ASCII 名。
      #
      # ★ 2026-10-29：补齐 AppImage 的**更新包**两类改名。
      #   原先只写了 `*.AppImage.sig` / `*.AppImage`，而 Tauri 开启
      #   createUpdaterArtifacts 后产出的更新包叫
      #   `*.AppImage.tar.gz`(+`.sig`) —— 它两个 case 都不匹配，
      #   落到兜底 `*) continue` 被**静默丢弃**：
      #   dist/ 里没有更新包 → latest.json 没有 linux-x86_64 →
      #   Linux 用户永远收不到自动更新，而流水线一路绿。
      #   ★ 四个 AppImage 分支都要留着：`.AppImage` 是安装包本体，
      #     `.AppImage.tar.gz` 才是更新包，`.sig` 各配一份。
      #
      # ★ 2026-10-29：版本号改从 Cargo.toml（SSOT）读，不再用 tag 名。
      #   理由：make_latest_json.py 的 version 字段读的是 Cargo.toml，
      #   两处来源不同时会出现「资产名一个版本、清单里另一个版本」，
      #   而那种错在客户端表现为「下载 404」，与本段要防的正是同一类。
      - name: Stage release assets with ASCII names
        shell: bash
        run: |
          set -euo pipefail
          VER=$(sed -n '/^\[package\]/,/^version/p' desktop/src-tauri/Cargo.toml \
                | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                | head -1)
          test -n "$VER" \
            || { echo "::error::无法从 Cargo.toml 读取版本号（SSOT）"; exit 1; }
          echo "资产版本号（Cargo.toml）：$VER"
          rm -rf dist && mkdir -p dist
          while IFS= read -r -d '' f; do
            b="${f##*/}"
            case "$b" in
              *setup.exe.sig)        n="xuandun-personal_${VER}_x64-setup.exe.sig" ;;
              *setup.exe)            n="xuandun-personal_${VER}_x64-setup.exe" ;;
              *.app.tar.gz.sig)      n="xuandun-personal_${VER}_aarch64.app.tar.gz.sig" ;;
              *.app.tar.gz)          n="xuandun-personal_${VER}_aarch64.app.tar.gz" ;;
              *.dmg)                 n="xuandun-personal_${VER}_aarch64.dmg" ;;
              *.AppImage.tar.gz.sig) n="xuandun-personal_${VER}_amd64.AppImage.tar.gz.sig" ;;
              *.AppImage.tar.gz)     n="xuandun-personal_${VER}_amd64.AppImage.tar.gz" ;;
              *.AppImage.sig)        n="xuandun-personal_${VER}_amd64.AppImage.sig" ;;
              *.AppImage)            n="xuandun-personal_${VER}_amd64.AppImage" ;;
              *.deb)                 n="xuandun-personal_${VER}_amd64.deb" ;;
              *) continue ;;
            esac
            cp "$f" "dist/$n"
          done < <(find artifacts -type f -print0)
          # 一个文件都没落到 dist 就是失败：空发布会误导所有人
          test -n "$(ls -A dist)" || { echo "::error::没有可发布的产物"; exit 1; }
          ls -l dist

      # ★ 2026-10-20：生成自动更新清单。
      #   它必须作为 Release 资产，前端 updater 从
      #   releases/latest/download/latest.json 读取。
      #   缺 .sig 或找不到更新包时直接失败——静默跳过的后果是
      #   「新版本发了，但所有旧版本都检查不到更新」。
      #
      # ★ P1-22：清单必须**先于**校验和生成 —— 否则 latest.json
      #   本身没有校验值，而它恰恰决定每个客户端从哪里下载更新，
      #   被替换的后果比任何一个安装包都严重。
      - name: Generate updater manifest
        # ★ 用 python3：release job 没有 setup-python，
        #   ubuntu-22.04 不保证存在 `python` 别名。
        # ★ 读 dist 而不是 artifacts：清单里的文件名必须与实际上传的
        #   ASCII 资产名逐字一致，否则客户端下载 404。
        run: python3 .github/scripts/make_latest_json.py dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # ★ P1-22：覆盖面从「只有安装包」扩展到**所有上传的资产**：
          #   安装包 + `.sig` 更新签名 + `latest.json` 更新清单。
          #   `.sig` 是客户端验签的唯一依据，latest.json 决定下载地址 ——
          #   这两个被替换的后果，比某个安装包被替换更严重。
          #   ★ 只有 checksums-sha256.txt 与 RELEASE_NOTES.md 不参与：
          #     前者不能自校验，后者会在下一步写入自身哈希（见 Compose）。
          find . -type f ! -name 'checksums-sha256.txt' ! -name 'RELEASE_NOTES.md' \
            -exec sha256sum {} \; \
            | sed 's|  \./|  |' | LC_ALL=C sort -k2 > checksums-sha256.txt
          cat checksums-sha256.txt
          # 一个都没算出来就是失败：静默产出空校验文件比报错更糟，
          # 用户会以为「没校验值也能装」。
          test -s checksums-sha256.txt \
            || { echo "::error::未找到任何安装包，校验文件为空"; exit 1; }
          # 必须真的覆盖到这两类，否则等于又退回旧口径。
          grep -q 'latest\.json' checksums-sha256.txt \
            || { echo "::error::校验和未覆盖 latest.json"; exit 1; }
          grep -q '\.sig' checksums-sha256.txt \
            || { echo "::error::校验和未覆盖 .sig 更新签名"; exit 1; }

      # ★★ 2026-10-29（第三轮审查 P0-9）：缺件门禁。
      #
      #   v0.1.27-alpha 的实际形态：整体 run = success，Release 已建，
      #   但只有 3/4 个平台产物 —— Linux AppImage 的 build job 在
      #   「Build Tauri app」被 runner 取消（同一形态第 4 次），
      #   而它带 continue-on-error，于是缺件谁也没被叫醒。
      #
      #   判据改成「**要上传的资产清单是否齐**」，而不是「各 job 是否绿」：
      #   dist/ 是下一步真正上传给用户的目录，缺了就是缺了。
      #
      #   ★ 为什么放在**创建 Release 之前**（而不是建完再删）：
      #     缺件时 Release 根本不存在，不需要「建了再删」——
      #     删除本身就带风险：删除 API 失败会留下一个残缺的公开 Release，
      #     而它已经通知过 watcher；此外「发了又撤」的痕迹比「没发」更难解释。
      #     发布前拦下，状态最干净、代价最小。
      #   ★ 豁免走仓库变量 ALLOW_MISSING_APPIMAGE=1（不是默认放行）：
      #     默认放行等于这道门禁不存在。
      #   ★ 豁免时脚本会写出正文提示，由「Compose release notes」贴进
      #     Release 正文 —— 缺件必须让用户看见，不能只在日志里说。
      - name: Assert every required asset is present
        env:
          # 仓库变量（Settings → Secrets and variables → Actions → Variables）
          ALLOW_MISSING_APPIMAGE: ${{ vars.ALLOW_MISSING_APPIMAGE }}
          # 提示文本写到 runner 临时目录：放进 dist/ 会被当成发布资产上传，
          # 也会混进 checksums-sha256.txt。
          ASSET_NOTICE_OUT: ${{ runner.temp }}/asset-notice.md
        run: python3 .github/scripts/check_release_assets.py dist --notice-out "$ASSET_NOTICE_OUT"

      # ★ 2026-10-27：发布说明改为**自己生成**，不再用
      #   generate_release_notes。原因很实在：用户点开 Release 的第一件事
      #   应该是「怎么确认这东西没被篡改」，而自动生成的变更列表给不了。
      #   误报申诉做得再好，用户在安装前仍需要一个自己能核对的依据。
      - name: Compose release notes
        shell: bash
        env:
          ASSET_NOTICE_OUT: ${{ runner.temp }}/asset-notice.md
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          {
            # ★ P0-9：缺件豁免的提示放在**最前面** —— 用户点开 Release
            #   第一眼就该知道「这次的 Linux 包不全、自动更新不能用」，
            #   而不是自己找半天才发现没有 AppImage。
            #   文件不存在 = 没有豁免，什么都不加。
            if [ -f "$ASSET_NOTICE_OUT" ]; then
              cat "$ASSET_NOTICE_OUT"
              echo
            fi
            # ★ 2026-10-30：本版更新说明（人话），与 latest.json 的 notes
            #   读同一个文件 —— 用户点开 Release 和在应用内看到的内容必须一致，
            #   否则「应用说改了 A、Release 说改了 B」只会让人怀疑两边都在糊弄。
            NOTES_FILE=".github/release_notes/$VER.md"
            if [ -f "$NOTES_FILE" ]; then
              echo "## 这一版改了什么"
              echo
              cat "$NOTES_FILE"
              echo
            else
              echo "::warning::缺少 $NOTES_FILE，应用内的更新提示将显示兜底文案"
            fi
            echo "## 安装前请做三步验证"
            echo
            echo "1. **核对哈希**：下载 \`checksums-sha256.txt\`，与本地文件算出的 SHA256 比对。不一致就不要安装 —— 那才可能是真的被篡改。"
            echo "2. **看签名**：Windows 安装包右键 → 属性 → 数字签名，可查看签名主体。若显示「无数字签名」，说明该版本未签名，请只依据第 1、3 步判断。"
            echo "3. **看多引擎扫描**：下表每个文件都附 VirusTotal 报告链接（按 SHA256 定位，扫描完成后即可打开）。"
            echo
            echo "> **被杀软拦截了？** 先完成第 1 步：哈希一致就说明文件没被换过，"
            echo "> 属于启发式误报（本产品是本地 AI 网关 + Python 打包引擎，行为画像容易中招）。"
            echo "> 按应用内「帮助 → 安装或运行时被杀毒软件拦截了，怎么办？」的步骤加入信任区即可。"
            echo
            echo "## 文件与校验"
            echo
            echo "| 文件 | SHA256 | VirusTotal |"
            echo "|---|---|---|"
            while read -r sha name; do
              [ -n "${sha:-}" ] || continue
              # 表格只列安装包：给 .sig / latest.json 挂 VirusTotal 报告链接
              # 没有意义（VT 不分析它们），它们仍完整出现在下方的原文块里。
              case "$name" in
                *.sig|latest.json) continue ;;
              esac
              echo "| \`$name\` | \`$sha\` | [查看报告](https://www.virustotal.com/gui/file/$sha) |"
            done < dist/checksums-sha256.txt
            echo
            echo "## 校验文件原文"
            echo
            echo '```'
            cat dist/checksums-sha256.txt
            echo '```'
            echo
            echo "> 本说明文件自身的 SHA256 追加在 \`checksums-sha256.txt\` 末尾"
            echo "> （表格里没有它，因为表格是先于本文件生成的）。"
            echo
            echo "版本：\`$VER\`　·　完整变更比对：https://github.com/${{ github.repository }}/compare/${GITHUB_REF_NAME}^...${GITHUB_REF_NAME}"
          } > dist/RELEASE_NOTES.md

          # ★ P1-22：发布说明也有校验值 —— 但**不能在它自己的正文里**
          #   （那会形成自引用）。做法：正文写完后把它的哈希追加到
          #   checksums 文件末尾，正文里已声明"在末尾"。
          ( cd dist && sha256sum RELEASE_NOTES.md >> checksums-sha256.txt )
          cat dist/RELEASE_NOTES.md

      # ★ P1-25：tag 被移动后重跑会**静默替换**已发布的资产 ——
      #   用户下载到的已经是另一个字节流，而 Release 页面看起来毫无变化。
      #   这里在创建前直接拒绝，把"覆盖"变成一次明确的失败。
      #
      # ★ 为什么不用 prerelease 标记来兜底：带 -alpha/-beta 的版本一旦
      #   标成 prerelease，GitHub 的 `releases/latest/download/latest.json`
      #   会直接 404（latest 只指向非预发布版本），
      #   结果就是全体客户端的自动更新同时失效。宁可保留普通发布，
      #   由 environment 审核 + 重名阻断来控制"谁能发、能不能覆盖"。
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME 已存在 —— tag 被移动后重跑会静默替换已发布资产，已阻断"
            exit 1
          fi
          echo "PASS：目标 Release 尚不存在"

      # ★ P1-21：SLSA 构建来源证明。
      #   在此之前，发布链只有"我们说是从这份源码构建的"，
      #   没有任何机器可回读的证据。证明写入仓库的 attestations 存储，
      #   任何人都可以用 `gh attestation verify` 独立核对。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.app.tar.gz
            dist/latest.json

      # ★ P1-21 后半：证明写完必须**回读**一次。
      #   「上传成功」和「能验证通过」是两件事，前者不保证后者。
      - name: Verify attestation is readable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found=0
          for f in dist/*.exe dist/*.dmg dist/*.deb dist/*.AppImage dist/*.app.tar.gz; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            echo "校验来源证明：${f##*/}"
            gh attestation verify "$f" --repo "${{ github.repository }}"
          done
          [ "$found" -gt 0 ] || { echo "::error::没有可校验的产物"; exit 1; }
          echo "PASS：来源证明可回读（$found 个产物）"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*
