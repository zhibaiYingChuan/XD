# SPDX-License-Identifier: DaoTi-Research-1.0
# 个人版发布流水线
#
# 为什么这个文件必须公开
# ────────────────────────────────────────────────────────────
# GitHub 只从 .github/workflows/ 读流水线。没有它就没有线上构建，
# 所以它不能跟 tests/ 一起移出仓库。
# 它只做构建与公钥断言（检查私钥有没有漏进仓库），
# 不含任何检测判据或攻击样本 —— 这与 tests/ 有本质区别。
#
# 个人版特有的门禁：激活码公钥。
# 缺公钥的包能启动、能显示界面、能跑通全部自检，
# 唯独每一个用户都激活不了 —— 发布后才发现等于白发一个版本。
# 那正是「静默降级」最典型的形态，所以这里必须在构建期拦死。
#
# 三平台构建的坑：**Nuitka 不能交叉编译**。
# 它调用的是本机 C 编译器，所以三个平台必须各自在对应 runner 上
# 编译引擎，而不是编一份再分发。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # 门禁：发布前的能力与密钥自检
  # ══════════════════════════════════════════════════════════
  preflight:
    name: Preflight Gate
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # ★★ 护栏必须在构建期就在位。
      #   护栏的 import 是延迟 import，Nuitka 静态分析看不到；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= 本 runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。
      #   这道门禁就是为拦住它存在的，必须在 CI 里跑。
      - name: Assert guardrail is bundled
        run: |
          set -euo pipefail
          python -m pytest tests/test_guardrail_in_build.py -q --no-header -p no:cacheprovider
          echo "PASS：护栏层已确认编入产物"

      # ★ 私钥绝不能出现在仓库里。
      #   一旦入库，任何人都能签发激活码，授权体系瞬间失效，
      #   且 Git 历史无法真正清除（后续删除，commit 里仍在）。
      - name: Assert private key is absent
        run: |
          set -euo pipefail
          # ★ 一次判断，不要 grep 串联 ——
          #   `grep -Ei 'a|\.pem$' | grep -i private` 里第一个分支已匹配全部
          #   .pem，第二个分支再过滤，绕一圈等于没过滤。
          #   直接按文件名含 private 判定。
          HIT=$(git ls-files | grep -i 'private' || true)
          if [ -n "$HIT" ]; then
            echo "::error::检测到疑似私钥被 git 追踪 —— 立即处理，视为安全事故"
            echo "$HIT"
            exit 1
          fi
          echo "PASS：私钥未被追踪"

      # 公钥必须在（build_engine.py 打包时要读它）
      # ★ 位置随 tools/ 移出而变更：公钥现在随包分发，放在包内。
      - name: Assert public key is present
        run: |
          set -euo pipefail
          PUB=src/daoti_xuandun_personal/license_pub.pem
          test -f "$PUB" \
            || { echo "::error::公钥缺失，干净 clone 上无法构建"; exit 1; }
          grep -q "BEGIN PUBLIC KEY" "$PUB" \
            || { echo "::error::公钥内容不是有效 PEM"; exit 1; }
          echo "PASS：公钥已入库且格式正确"

  build:
    name: Build (${{ matrix.art }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # ★ 每项都带一个紧凑 id（如 win-x64），专供 artifact 命名。
          #   不能用 matrix.name —— 里面有空格（"Windows x64"），
          #   也不能用 matrix.target —— Linux 的 deb 与 AppImage
          #   两个 job 的 target 完全相同，artifact 名字会撞，
          #   upload-artifact 直接失败。
          - os: windows-latest
            name: Windows x64
            art: win-x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundle_glob: '*.exe'
          - os: macos-14
            name: macOS arm64
            art: mac-arm64
            target: aarch64-apple-darwin
            bundle: dmg
            bundle_glob: '*.dmg'
          - os: ubuntu-22.04
            name: Linux x64
            art: linux-deb
            target: x86_64-unknown-linux-gnu
            bundle: deb
            bundle_glob: '*.deb'

          # ★ AppImage 单开一个 job，与 deb 分离。
          #
          #   AppImage 走 linuxdeploy，而 linuxdeploy 必须把应用依赖的
          #   每一个 ELF 库都打进包里（这是 AppImage 格式的定义）。
          #   护栏 9 个模块都 import numpy，numpy 自带的 OpenBLAS 叫
          #   libscipy_openblas64_-<hash>.so（scipy 只是 OpenBLAS 的历史
          #   命名，项目并未安装 scipy），它位于 numpy.libs/ 子目录。
          #   linuxdeploy 解析子目录里的相对路径依赖时有已知缺陷，
          #   会报 `Could not find dependency: libscipy_openblas64_*.so`
          #   并终止整个打包。
          #
          #   deb 打包不调 linuxdeploy、不扫 ELF 依赖，因此 Linux 用户
          #   先有可安装的 deb；AppImage 是覆盖面更广但脆弱的补充，
          #   它失败不该让整个发布失败 —— 否则 Ubuntu 用户已经能装上的
          #   东西，反而被一个用不上的 AppImage 卡住。
          #
          #   continue-on-error: true —— 允许这个 job 失败，
          #   Release 步骤仍会拿到 deb 与另两个平台的产物。
          - os: ubuntu-22.04
            name: Linux AppImage
            art: linux-appimage
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            bundle_glob: '*.AppImage'
            allow_failure: true

    runs-on: ${{ matrix.os }}

    # ★ 只对 AppImage 那个矩阵项放行失败。
    #   continue-on-error 是 job 级属性，不能写在 matrix include 里
    #   （那样只是多出一个没人读的普通字段，不产生任何效果）——
    #   所以条件写成「非 Linux AppImage 时恒为 false」。
    #
    #   这样设计的理由：AppImage 的失败源于 linuxdeploy 扫 ELF 依赖
    #   时的缺陷，与本项目的代码正确性无关。让它失败等于让
    #   「Ubuntu 用户能装上的 deb」也发不出去。
    continue-on-error: ${{ matrix.allow_failure || false }}

    # ★★ 整个 job 强制 UTF-8。
    #   windows-latest 的控制台编码是 GBK（cp936），
    #   任何中文提示里的「→」「★」都会让 print 抛
    #   UnicodeEncodeError: 'charmap' codec can't encode characters
    #   把构建打断 —— 表面看是「Build Nuitka engine 退出码 1」，
    #   真实原因却与编译毫无关系，极难定位。
    #   在 job 级设置，Nuitka 等子进程也会继承。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      # ★ 各平台用该平台的 Rust 工具链。macOS runner 是 arm64，
      #   显式指定 aarch64-apple-darwin 而不用默认工具链，
      #   否则会按 x86_64 交叉编译，产物在 M 系列机器上跑不起来。
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Linux 打包 AppImage 需要这些系统库。
      # 缺 libwebkit2gtk 会报 "Required library 'webkit2gtk-4.1' not found"。
      #
      # ★ APPIMAGE_EXTRACT_AND_RUN=1 是**必须**的，不是优化：
      #   AppImage 运行时必须用 FUSE 把自身挂载出来才能执行，
      #   而 GitHub 的 ubuntu runner 跑在容器里，/dev/fuse 不可用
      #   （典型报错 "failed to run linuxdeploy" —— linuxdeploy 本身
      #   是个 AppImage，它挂载不上去就直接死给你看）。
      #   这个变量让它改成「解包到临时目录再运行」，绕开 FUSE。
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # ★ 钉死 Nuitka 版本：版本漂移会改变构建行为
          #   （含 ccache 下载策略），历史上因此出现过「同样的代码构建失败」。
          pip install "nuitka==4.1.3"
          pip install -e .

      # ★★ UTF-8 输出自检 —— 在**真实 runner 环境**里验证。
      #   这条不是多余：Windows runner 默认 GBK，中文里的「→」「★」
      #   会让 print 抛 UnicodeEncodeError，把构建打断成
      #   「Build Nuitka engine 退出码 1」，而真实原因与编译无关。
      #   在这里先跑一次同样的输出，编码有问题就会立刻暴露，
      #   而不是等十分钟后从 Nuitka 失败里反推。
      #
      #   用 shell: bash 是刻意的 —— GitHub 默认的 pwsh 也会走 UTF-8，
      #   反而复现不出 GBK 环境；bash + 无 PYTHONIOENCODING 才接近
      #   runner 的默认状态。
      - name: Verify UTF-8 output
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          print("编码自检：护栏层已就位 → 将编入 ★")
          sys.stderr.write("[FATAL] 找不到护栏层源码，构建中止。\n")
          enc = (sys.stdout.encoding or "").lower().replace("-", "")
          print(f"stdout 编码 = {sys.stdout.encoding}")
          if enc not in ("utf8", "cp65001"):
              print(f"::error::stdout 编码是 {sys.stdout.encoding}，不是 UTF-8")
              sys.exit(1)
          PY
          echo "PASS：UTF-8 输出正常"

      # ★ Nuitka 必须在目标平台本机跑 —— 它调用的是本机 C 编译器，
      #   不能交叉编译。所以这里是三个 runner 各自编译，不是编译三份。
      - name: Build Nuitka engine
        working-directory: desktop
        # 缺公钥时该脚本 return 4 —— 这里不做绕过。
        # 公钥缺失就是发布阻断，不是可选项。
        run: python build_engine.py

      # ★★ 引擎必须编入**本次构建时**的源码（2026-10-03 新增）
      #
      #   本地踩过的坑：改完 Python 源码后没有重新 build_engine，
      #   于是产物里是旧代码 —— 而「引擎文件时间晚于源码文件时间」
      #   看起来完全正常，检查通过了，装机后功能却是旧的。
      #
      #   症状极具误导性：装上去能启动、界面正常、
      #   只有「新加的那个接口」报 422 或404，
      #   而报错信息与「引擎是旧的」毫无关系。
      #
      #   判据：引擎二进制里必须含本轮新增功能的独有标识。
      #   选标识的原则是「只在修复后才出现」——
      #   用修复前就存在的字符串做判据，等于没检查。
      - name: Assert engine contains this build's code
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=$(find desktop/src-tauri/resources/engine -name 'xuandun-engine-*' -type f -print -quit)
          if [ -z "$ENGINE" ]; then
            echo "::error::引擎产物不存在"
            exit 1
          fi
          echo "引擎：$ENGINE"
          # 每条标识都对应一个「装出来才发现功能不对」的历史缺陷：
          #   marked_safe = ?      ← 日志筛选条件（曾「共 128 条却筛不出来」）
          #   top_domains          ← 日志概览统计
          #   _recompute_daily_stats ← 删日志后首页统计同步（曾清空了数字还在）
          #   wal_checkpoint        ← 原始敏感值真正离开磁盘
          MISSING=0
          for MARK in 'marked_safe = ?' 'top_domains' \
                      '_recompute_daily_stats' 'wal_checkpoint'; do
            if grep -qa -- "$MARK" "$ENGINE"; then
              echo "  ✓ $MARK"
            else
              echo "::error::引擎缺少标识「$MARK」—— 编译的是旧源码，请重新运行 build_engine.py"
              MISSING=$((MISSING + 1))
            fi
          done
          test "$MISSING" -eq 0 || exit 1
          echo "PASS：引擎已编入本次构建的代码"

      # ★★★ 产物级断言：本 workflow 存在的核心理由
      #
      #   前面所有检查都是「源码/配置对不对」，这两条是
      #   「**编译出来的二进制里到底还剩不剩交付能力**」。
      #
      #   公钥：build_engine.py 会拷公钥，但「脚本说拷了」不等于
      #   「真的拷了」。缺公钥的包能启动、能自检通过，唯独每个用户
      #   都激活不了 —— 发布后才发现等于白发一个版本。
      #
      #   护栏：import 是延迟 import，Nuitka 静态分析看不到它；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。用户以为自己受保护。
      #
      #   ★ 判据与实现都在 desktop/verify_guardrail_bundle.py，不内联在 YAML。
      #     内联脚本藏在 YAML 缩进与 heredoc 里，本机无从验证 ——
      #     2026-09-28 连续三轮栽在内联 Python 上（f-string 嵌套引号、
      #     set -u 下 unbound variable、Windows 相对路径），每一轮都要
      #     等十分钟的 CI 才暴露。独立文件可以本地跑通再推。
      #
      #   ★ 公钥判据：产物目录里确实有 license_pub.pem。
      #   ★ 护栏判据：在二进制里搜判据标识（system_prompt_inject /
      #     sensitive_leak）。不能找 .py 文件 —— Nuitka standalone 把
      #     模块编译进二进制，dist/ 下只剩 data 文件，源码根本不出现；
      #     也不能只看目录存在 —— 空壳目录同样满足，而它毫无防护能力。
      #     判据标识只由护栏代码产生，护栏缺失时必然搜不到。
      - name: Assert public key landed in bundle
        working-directory: desktop
        run: python verify_guardrail_bundle.py --pubkey-only

      - name: Assert guardrail is present in compiled engine
        working-directory: desktop
        run: python verify_guardrail_bundle.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # ★★ Linux AppImage 专用：把 numpy 自带的科学计算库链注册进系统库路径。
      #
      #   2026-09-29 从 v0.1.0-alpha16 的 --verbose 日志读出的**真实机制**：
      #
      #     Deploying dependencies for ELF file .../engine/numpy/_core/_multiarray_umath.so
      #     ERROR: Could not find dependency: libgfortran-040039e1-0352e75f.so.5.0.0
      #     ERROR: Failed to deploy dependencies for existing files
      #
      #   linuxdeploy 逐个 ELF 解析 DT_NEEDED，只在两类位置找依赖：
      #     ① 引用方**自己所在的目录**
      #     ② 系统库路径（即 ldconfig 的搜索列表）
      #
      #   ★★ 关键：要注册的是**整条传递依赖链**，不止 OpenBLAS 一个。
      #
      #     依赖关系（全部来自同一份日志，可逐条验证）：
      #       numpy/_core/_multiarray_umath.so
      #         └─ libscipy_openblas64_-32a4b2a6.so   （在 engine/ 根部）
      #              └─ libgfortran-040039e1-*.so.5.0.0  ← 缺的就是它
      #                   └─ libquadmath-96973f99-*.so.0.0.0
      #
      #     之前的版本只注册了 OpenBLAS。日志显示它确实生效了
      #     （ldconfig 匹配项数=1，linuxdeploy 也成功部署了它
      #     和它的依赖 libgfortran），
      #     但**下一层**的 libgfortran 引用方在 numpy/_core/，
      #     自己在 engine/ 根部 —— ①那条路覆盖不到，
      #     而它从未进过系统库索引，②也覆盖不到 → 整包失败。
      #
      #     所以这里把 libgfortran / libquadmath 一并注册，
      #     覆盖到链条的每一环。
      #
      #   ★ 这不是「绕过依赖检查」：注册之后 linuxdeploy 依然按它自己的
      #     规则解析并部署这些库，产出的 AppImage 与 deb 运行时行为一致。
      #   ★ 单个库找不到不失败：整批尽力而为，产物能否打出由
      #     后面的打包结果决定（失败也已被降级为警告）。
      - name: Register numpy native libs for linuxdeploy
        if: matrix.allow_failure
        shell: bash
        working-directory: desktop
        run: |
          set -uo pipefail
          # ★ 三类都要：OpenBLAS 本身 + 它的两个下游。
          #   少注册任何一个，linuxdeploy 都会在下一层报
          #   "Could not find dependency"，而那个报错出现在
          #   几万行日志末尾，很容易被误读成别的原因。
          missing=0
          for pat in 'libscipy_openblas64*.so*' 'libgfortran*.so*' 'libquadmath*.so*'; do
            lib="$(find src-tauri/resources/engine -name "$pat" -type f -print -quit)"
            if [ -z "$lib" ]; then
              echo "::warning::引擎产物里没有 $pat"
              missing=$((missing + 1))
              continue
            fi
            echo "注册：$(basename "$lib")"
            sudo cp -v "$lib" /usr/lib/x86_64-linux-gnu/
          done
          sudo ldconfig
          echo "---- 注册后系统库索引核对 ----"
          for pat in scipy_openblas gfortran quadmath; do
            echo "  $pat → $(ldconfig -p | grep -c "$pat" || true) 项"
          done
          if [ "$missing" -gt 0 ]; then
            echo "::warning::有 $missing 类库未找到，AppImage 可能仍会因依赖缺失而失败（deb 不受影响）。"
          fi
          exit 0

      - name: Build Tauri app
        working-directory: desktop
        # ★ 必须显式指定 --bundles，且传的是**格式名**（nsis/dmg/deb/appimage）
        #   而不是通配符 —— 命令行不接受 glob。
        #   各平台只能构建自己支持的格式，传 all 会让 macOS runner
        #   尝试产出 .exe 而失败。
        #
        # ★ 这里不再设 APPIMAGE_EXTRACT_AND_RUN / NO_STRIP。
        #   2026-09-28 曾先后加上这两个变量，各花一轮 17 分钟的 CI，
        #   两次都与真实故障无关：
        #     · APPIMAGE_EXTRACT_AND_RUN —— Tauri 自己就设了这个环境变量
        #       并传了 --appimage-extract-and-run（见 tauri-bundler 的
        #       appimage/linuxdeploy.rs），我们设的是重复的。
        #     · NO_STRIP —— 试的是「strip 失败」这个假设，未被证实。
        #   真实原因是 linuxdeploy 解析 DT_NEEDED 时找不到 numpy 的
        #   libscipy_openblas64_*.so（见上一步 Register numpy OpenBLAS）。
        #   ★ 曾把根因记成「由 build_engine.py 平铺 .so 解决」—— 那是
        #     误判：平铺是把该库放到引擎根部，而引用方在 numpy/_core/，
        #     目录不同，linuxdeploy 照样找不到。已按日志更正。
        #
        # ★ --verbose 保留：它让 linuxdeploy 的真实报错出现在日志里。
        #   没有它，Tauri 只给一句 "failed to run linuxdeploy"，
        #   FUSE / strip / 依赖缺失三种故障长得一模一样。
        #   一次构建 17 分钟，看不见原因等于盲飞 —— 这正是本次
        #   连续两轮误判的直接原因。
        #
        # ★ 失败处理：AppImage 是 continue-on-error 的可选产物，
        #   「job 标红」会让整轮 CI 带上一个 error 注解，观感等同
        #   「构建坏了」—— 而 deb / Windows / macOS 三个包其实都好好的。
        #   故这里把该矩阵项的失败**显式降级为 warning**：
        #   信息仍留在日志与注解里，但不再把整轮结果染红。
        #   非 AppImage 的矩阵项照旧 exit 1，失败仍会阻断发布。
        # ★ 必须显式声明 shell: bash —— 本段是 bash 语法（if/then/fi、[ "$X" = ... ]）。
        #   不声明时 GitHub 按 runner 的**默认 shell** 执行：macOS/Linux 是 bash，
        #   但 **Windows 是 pwsh**，而 pwsh 解析不了 bash 的 if 语句 ——
        #   v0.1.0-alpha12 的 Build (win-x64) 就是这么挂的：
        #     ParserError: ...ps1:2
        #     Missing '(' after 'if' in if statement.
        #   ★ 危险点：Linux/macOS 三个 job 全绿、只有 Windows 红，
        #     很容易被误读成「Windows 平台性问题」而往错的方向查。
        #     真实原因是 shell 选错了，与平台、代码都无关。
        shell: bash
        run: |
          if npm run tauri build -- --verbose --bundles ${{ matrix.bundle }}; then
            exit 0
          fi
          if [ "${{ matrix.allow_failure }}" = "true" ]; then
            echo "::warning title=AppImage 打包失败（可选产物，不阻断发布）::linuxdeploy 未能完成打包，详见本步骤日志；deb 与 Windows/macOS 产物不受影响。"
            exit 0
          fi
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          # ★ 用 matrix.art 而不是 matrix.target 命名。
          #   Linux 的 deb 与 AppImage 是两个 job 但 target 相同
          #   （都是 x86_64-unknown-linux-gnu），artifact 名字冲突时
          #   upload-artifact 会直接失败 —— 而且报错与真实原因
          #   毫无关联，不容易联想到是命名撞了。
          name: xuandun-personal-${{ matrix.art }}
          path: desktop/src-tauri/target/release/bundle/**/${{ matrix.bundle_glob }}
          # ★ 非 AppImage 的矩阵项：没产出文件就是失败。
          #   包少一个而没人知道，比构建失败更糟。
          #
          # ★ AppImage 矩阵项：降为 warn。它已在上一步被显式降级
          #   （打包失败 → warning + exit 0），若这里仍要求 error，
          #   就会把同一个「可选产物没打出来」再报成一次失败，
          #   整轮 CI 又变回一个 error 注解 —— 等于降级没做。
          #   缺失信息已由那一条 warning 承载，不会静默消失。
          if-no-files-found: ${{ matrix.allow_failure && 'warn' || 'error' }}

  release:
    name: Create Release
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # ★ 四种格式都要算。只认 *.exe 的话，macOS/Linux 用户
          #   拿不到任何校验值 —— 而校验值恰恰是他们最需要的
          #   （从第三方下载时无法确认文件未被篡改）。
          #   *.deb 同样必须算：它是 Linux 的**主力**安装格式。
          find . -type f \( -name "*.exe" -o -name "*.dmg" \
                         -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; \
            | sed 's|  \./[^ ]*/|  |' > checksums-sha256.txt
          cat checksums-sha256.txt
          # 一个都没算出来就是失败：静默产出空校验文件比报错更糟，
          # 用户会以为「没校验值也能装」。
          test -s checksums-sha256.txt \
            || { echo "::error::未找到任何安装包，校验文件为空"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/checksums-sha256.txt
