# SPDX-License-Identifier: DaoTi-Research-1.0
# 个人版发布流水线
#
# 为什么这个文件必须公开
# ────────────────────────────────────────────────────────────
# GitHub 只从 .github/workflows/ 读流水线。没有它就没有线上构建，
# 所以它不能跟 tests/ 一起移出仓库。
# 它只做构建与公钥断言（检查私钥有没有漏进仓库），
# 不含任何检测判据或攻击样本 —— 这与 tests/ 有本质区别。
#
# 个人版特有的门禁：激活码公钥。
# 缺公钥的包能启动、能显示界面、能跑通全部自检，
# 唯独每一个用户都激活不了 —— 发布后才发现等于白发一个版本。
# 那正是「静默降级」最典型的形态，所以这里必须在构建期拦死。
#
# 三平台构建的坑：**Nuitka 不能交叉编译**。
# 它调用的是本机 C 编译器，所以三个平台必须各自在对应 runner 上
# 编译引擎，而不是编一份再分发。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # 门禁：发布前的能力与密钥自检
  # ══════════════════════════════════════════════════════════
  preflight:
    name: Preflight Gate
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # ★ 私钥绝不能出现在仓库里。
      #   一旦入库，任何人都能签发激活码，授权体系瞬间失效，
      #   且 Git 历史无法真正清除（后续删除，commit 里仍在）。
      - name: Assert private key is absent
        run: |
          set -euo pipefail
          # ★ 一次判断，不要 grep 串联 ——
          #   `grep -Ei 'a|\.pem$' | grep -i private` 里第一个分支已匹配全部
          #   .pem，第二个分支再过滤，绕一圈等于没过滤。
          #   直接按文件名含 private 判定。
          HIT=$(git ls-files | grep -i 'private' || true)
          if [ -n "$HIT" ]; then
            echo "::error::检测到疑似私钥被 git 追踪 —— 立即处理，视为安全事故"
            echo "$HIT"
            exit 1
          fi
          echo "PASS：私钥未被追踪"

      # 公钥必须在（build_engine.py 打包时要读它）
      # ★ 位置随 tools/ 移出而变更：公钥现在随包分发，放在包内。
      - name: Assert public key is present
        run: |
          set -euo pipefail
          PUB=src/daoti_xuandun_personal/license_pub.pem
          test -f "$PUB" \
            || { echo "::error::公钥缺失，干净 clone 上无法构建"; exit 1; }
          grep -q "BEGIN PUBLIC KEY" "$PUB" \
            || { echo "::error::公钥内容不是有效 PEM"; exit 1; }
          echo "PASS：公钥已入库且格式正确"

      # ★ 防护能力测试（tests/）已移出公开仓库，不在 CI 内运行。
      #   判据与攻击样本是核心资产，不能公开。
      #   代价是「构建成功」不再等于「防护能力没退化」——
      #   这道门禁改在私有仓库或本地跑。
      #   保留原有的引擎产物断言作为最低限度的兜底。

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundle_glob: '*.exe'
          - os: macos-14
            name: macOS arm64
            target: aarch64-apple-darwin
            bundle: dmg
            bundle_glob: '*.dmg'
          - os: ubuntu-22.04
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            bundle_glob: '*.AppImage'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      # ★ 各平台用该平台的 Rust 工具链。macOS runner 是 arm64，
      #   显式指定 aarch64-apple-darwin 而不用默认工具链，
      #   否则会按 x86_64 交叉编译，产物在 M 系列机器上跑不起来。
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Linux 打包 AppImage 需要这些系统库。
      # 缺 libwebkit2gtk 会报 "Required library 'webkit2gtk-4.1' not found"。
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # ★ 钉死 Nuitka 版本：版本漂移会改变构建行为
          #   （含 ccache 下载策略），历史上因此出现过「同样的代码构建失败」。
          pip install "nuitka==4.1.3"
          pip install -e .

      # ★ Nuitka 必须在目标平台本机跑 —— 它调用的是本机 C 编译器，
      #   不能交叉编译。所以这里是三个 runner 各自编译，不是编译三份。
      - name: Build Nuitka engine
        working-directory: desktop
        # 缺公钥时该脚本 return 4 —— 这里不做绕过。
        # 公钥缺失就是发布阻断，不是可选项。
        run: python build_engine.py

      - name: Assert public key landed in bundle
        working-directory: desktop
        # ★ 这条断言是本 workflow 存在的核心理由。
        #   build_engine.py 会拷公钥，但「脚本说拷了」不等于「真的拷了」。
        #   断言产物目录里确实有它，才算闭环。
        run: |
          set -euo pipefail
          test -f src-tauri/resources/engine/license_pub.pem \
            || { echo "::error::引擎产物里没有 license_pub.pem —— 所有用户都将无法激活"; exit 1; }
          echo "PASS：公钥已落入引擎产物"

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        # ★ 必须显式指定 --bundles，且传的是**格式名**（nsis/dmg/appimage）
        #   而不是通配符 —— 命令行不接受 glob。
        #   各平台只能构建自己支持的格式，传 all 会让 macOS runner
        #   尝试产出 .exe 而失败。
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-personal-${{ matrix.target }}
          path: desktop/src-tauri/target/release/bundle/**/${{ matrix.bundle_glob }}
          # 空产物必须报错：上传 0 个文件却显示成功，
          # 会让后续 release 创建一个没有任何安装包的版本。
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # ★ 三种格式都要算。只认 *.exe 的话，macOS/Linux 用户
          #   拿不到任何校验值 —— 而校验值恰恰是他们最需要的
          #   （从第三方下载时无法确认文件未被篡改）。
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) \
            -exec sha256sum {} \; \
            | sed 's|  \./[^ ]*/|  |' > checksums-sha256.txt
          cat checksums-sha256.txt
          # 一个都没算出来就是失败：静默产出空校验文件比报错更糟，
          # 用户会以为「没校验值也能装」。
          test -s checksums-sha256.txt \
            || { echo "::error::未找到任何安装包，校验文件为空"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/checksums-sha256.txt
