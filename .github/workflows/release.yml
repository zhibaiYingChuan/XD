name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# WB-20/WB-32 修复：并发控制，取消旧版本构建
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # B-03 修复：harden-runner 出网过滤（安全加固）
      # CVE-2024-52587/CVE-2026-25598 修复：升级到 v2.16.0
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify version consistency (SSOT gate)
        working-directory: desktop/xuandun-desktop
        run: python sync_version.py --check

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Setup Node 20 LTS (与 CI 环境对齐，P1-9 版本锁定)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Setup Rust 1.94.0 (与 CI 构建环境对齐，P0-A 发布阻断修复)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 根源修复：钉定 Nuitka 版本，防止版本漂移改变构建行为（含 ccache 下载策略）
          pip install nuitka==4.1.3 numpy
          pip install -e ".[engine]"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Nuitka engine
        working-directory: desktop/xuandun-desktop
        run: python build_engine.py

      - name: Install frontend dependencies
        working-directory: desktop/xuandun-desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop/xuandun-desktop
        run: npm run tauri build

      - name: Rename bundle files to ASCII
        shell: bash
        run: |
          cd desktop/xuandun-desktop/src-tauri/target/release/bundle
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) | while read f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            newbase=$(echo "$base" | sed 's/道体玄盾/XuanDun/g')
            [ "$base" != "$newbase" ] && mv "$f" "$dir/$newbase" && echo "Renamed: $base -> $newbase"
          done

      # SLSA Level 1: 生成构建 provenance attestation
      # 使用 actions/attest-build-provenance v4.1.0 为构建产物生成签名证明
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.deb

      # WB-19 修复：if-no-files-found 从 warn 改为 error，防止空资产上传
      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-${{ matrix.target }}
          path: |
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.AppImage
            desktop/xuandun-desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  # 【2026-08-04 误报治理 P0】：发布前 VirusTotal 硬拦截。
  #   - 上传所有产物到 VirusTotal v3 API 扫描；
  #   - 若启发式恶意/可疑引擎数 > VT_FALSE_POSITIVE_THRESHOLD（默认 5）
  #     → CI 失败，阻断 Release 创建；
  #   - 生成误报报告存为 artifact，便于后续提交厂商申诉。
  # 需要 GitHub Secrets 中配置 VIRUSTOTAL_API_KEY（免费版每日限额 500 次/月 32k 次）。
  virustotal_scan:
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VT_FALSE_POSITIVE_THRESHOLD: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: VirusTotal scan & false-positive gate
        shell: bash
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          echo "=== VirusTotal False-Positive Gate (threshold=$VT_FALSE_POSITIVE_THRESHOLD engines) ==="
          echo "VT API key configured: $([ -n "${VIRUSTOTAL_API_KEY:-}" ] && echo YES || echo NO)"

          REPORT="virustotal_report.md"
          EXIT_CODE=0
          echo "# VirusTotal 扫描报告" > "$REPORT"
          echo "" >> "$REPORT"
          echo "触发版本：${GITHUB_REF#refs/tags/}  " >> "$REPORT"
          echo "阈值：恶意+可疑引擎数 > ${VT_FALSE_POSITIVE_THRESHOLD} → 阻断发布" >> "$REPORT"
          echo "" >> "$REPORT"

          if [ -z "${VIRUSTOTAL_API_KEY:-}" ]; then
            echo "[WARNING] 未配置 VIRUSTOTAL_API_KEY Secret，跳过 VirusTotal 扫描（无法检测误报率）"
            echo "" >> "$REPORT"
            echo "## [WARNING] 未启用 VirusTotal 扫描" >> "$REPORT"
            echo "未在 GitHub Secrets 配置 VIRUSTOTAL_API_KEY，跳过发布前误报率检测。**强烈建议启用此门禁以避免 Trojan/Intercept.a 类误报事件。**" >> "$REPORT"
            exit 0
          fi

          pip install --quiet requests

          python << 'PYEOF'
          import os, sys, time, requests, glob, json

          API_KEY = os.environ["VIRUSTOTAL_API_KEY"]
          THRESHOLD = int(os.environ.get("VT_FALSE_POSITIVE_THRESHOLD", "5"))
          HEADERS = {"x-apikey": API_KEY}
          EXIT_CODE = 0
          REPORT = os.environ.get("REPORT_FILE", "virustotal_report.md")

          files = []
          for pattern in ["artifacts/**/*.exe", "artifacts/**/*.dmg", "artifacts/**/*.AppImage", "artifacts/**/*.deb"]:
              files.extend(glob.glob(pattern, recursive=True))
          files = sorted(set(files))
          print(f"Found {len(files)} files to scan")

          report_lines = ["## 扫描结果明细\n"]

          for idx, fpath in enumerate(files, 1):
              fname = os.path.basename(fpath)
              fsize = os.path.getsize(fpath)
              print(f"\n[{idx}/{len(files)}] Uploading {fname} ({fsize/1024/1024:.1f} MB)...")

              # 1) 上传文件
              with open(fpath, "rb") as fp:
                  if fsize < 32 * 1024 * 1024:
                      r = requests.post(
                          "https://www.virustotal.com/api/v3/files",
                          headers=HEADERS,
                          files={"file": (fname, fp)},
                          timeout=120,
                      )
                  else:
                      # >32MB: 先获取上传 URL
                      r_url = requests.get(
                          "https://www.virustotal.com/api/v3/files/upload_url",
                          headers=HEADERS, timeout=30,
                      )
                      r_url.raise_for_status()
                      upload_url = r_url.json()["data"]
                      r = requests.post(upload_url, headers=HEADERS, files={"file": (fname, fp)}, timeout=300)
              if r.status_code >= 400:
                  print(f"  UPLOAD FAIL: {r.status_code} {r.text[:200]}")
                  report_lines.append(f"### ❌ {fname}\n**上传失败**: HTTP {r.status_code}\n")
                  continue
              analysis_id = r.json()["data"]["id"]
              print(f"  analysis_id = {analysis_id}")

              # 2) 轮询分析结果（最多等15分钟，VT 大型文件扫描较慢）
              analysis_url = f"https://www.virustotal.com/api/v3/analyses/{analysis_id}"
              stats = None
              for attempt in range(45):
                  time.sleep(20)
                  a = requests.get(analysis_url, headers=HEADERS, timeout=30)
                  if a.status_code != 200:
                      continue
                  data = a.json()["data"]
                  status = data["attributes"]["status"]
                  if status == "completed":
                      stats = data["attributes"]["stats"]
                      break
                  print(f"  poll {attempt+1}: status={status}")
              if stats is None:
                  print(f"  TIMEOUT: analysis not completed in 15 min")
                  report_lines.append(f"### ⏳ {fname}\n扫描超时（15分钟未完成），请稍后手动复查。\n")
                  continue

              malicious = stats.get("malicious", 0)
              suspicious = stats.get("suspicious", 0)
              undetected = stats.get("undetected", 0)
              harmless = stats.get("harmless", 0)
              total = malicious + suspicious + undetected + harmless + stats.get("timeout", 0) + stats.get("type-unsupported", 0)
              flagged = malicious + suspicious
              verdict = "✅ PASS" if flagged <= THRESHOLD else "🚫 BLOCK"
              if flagged > THRESHOLD:
                  EXIT_CODE = 1

              # 3) 采集触发误报的引擎名（供申诉参考）
              flagging_engines = []
              a = requests.get(analysis_url, headers=HEADERS, timeout=30)
              results = a.json()["data"]["attributes"]["results"]
              for eng, res in results.items():
                  c = res.get("category", "")
                  if c in ("malicious", "suspicious"):
                      flagging_engines.append(f"{eng}={res.get('result','?')}")

              perm_url = f"https://www.virustotal.com/gui/file-analysis/{analysis_id}"
              print(f"  {verdict}: flagged={flagged}/{total} (mal={malicious} susp={suspicious})")
              print(f"  URL: {perm_url}")
              report_lines.append(f"### {verdict} {fname}\n")
              report_lines.append(f"| 指标 | 值 |\n|---|---|")
              report_lines.append(f"| 文件大小 | {fsize/1024/1024:.1f} MB |")
              report_lines.append(f"| 扫描链接 | [VirusTotal]({perm_url}) |")
              report_lines.append(f"| 恶意引擎数 / 总引擎数 | **{malicious} / {total}** |")
              report_lines.append(f"| 可疑引擎数 | {suspicious} |")
              report_lines.append(f"| 安全引擎数 | {harmless + undetected} |")
              report_lines.append(f"| **触发拦截引擎** | {', '.join(flagging_engines) if flagging_engines else '_无（疑似误报为0）_'} |\n")

          # 写 REPORT
          with open(REPORT, "a", encoding="utf-8") as out:
              out.write("\n".join(report_lines))

          print(f"\n=== GATE RESULT: {'PASS' if EXIT_CODE == 0 else 'BLOCK (too many false positives)'} ===")
          sys.exit(EXIT_CODE)
          PYEOF

      - name: Upload VirusTotal report artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: virustotal-report
          path: virustotal_report.md
          if-no-files-found: warn

  # WB-18 修复：if: always() → if: success()，部分平台失败时不创建 Release
  release:
    needs: [build, virustotal_scan]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # P1 修复：release job 也需要 harden-runner 安全加固
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      # B-04 修复：生成 SHA256 校验和并上传到 Release
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \) -exec sha256sum {} \; | sed 's|  \./[^ ]*/|  |' > checksums-sha256.txt
          echo "=== SHA256 Checksums ==="
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/checksums-sha256.txt

  # B-04 修复：verify job — 下载 Release 资产并验证 SHA256
  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - name: Download release assets and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Verifying release assets for tag: $TAG"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/checksums-sha256.txt" -o checksums-sha256.txt
          echo "=== Expected checksums ==="
          cat checksums-sha256.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}')
            echo "Downloading: $file"
            curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/${file}" -o "$file"
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$sha" = "$actual" ]; then
              echo "PASS: $file"
            else
              echo "FAIL: $file (expected: $sha, got: $actual)"
              exit 1
            fi
          done < checksums-sha256.txt
          echo "=== All assets verified ==="