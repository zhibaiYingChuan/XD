# SPDX-License-Identifier: DaoTi-Research-1.0
# 个人版发布流水线
#
# 为什么这个文件必须公开
# ────────────────────────────────────────────────────────────
# GitHub 只从 .github/workflows/ 读流水线。没有它就没有线上构建，
# 所以它不能跟 tests/ 一起移出仓库。
# 它只做构建与公钥断言（检查私钥有没有漏进仓库），
# 不含任何检测判据或攻击样本 —— 这与 tests/ 有本质区别。
#
# 个人版特有的门禁：激活码公钥。
# 缺公钥的包能启动、能显示界面、能跑通全部自检，
# 唯独每一个用户都激活不了 —— 发布后才发现等于白发一个版本。
# 那正是「静默降级」最典型的形态，所以这里必须在构建期拦死。
#
# 三平台构建的坑：**Nuitka 不能交叉编译**。
# 它调用的是本机 C 编译器，所以三个平台必须各自在对应 runner 上
# 编译引擎，而不是编一份再分发。

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════════════════════
  # 门禁：发布前的能力与密钥自检
  # ══════════════════════════════════════════════════════════
  preflight:
    name: Preflight Gate
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      # ★★ 护栏必须在构建期就在位。
      #   护栏的 import 是延迟 import，Nuitka 静态分析看不到；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= 本 runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。
      #   这道门禁就是为拦住它存在的，必须在 CI 里跑。
      - name: Assert guardrail is bundled
        run: |
          set -euo pipefail
          python -m pytest tests/test_guardrail_in_build.py -q --no-header -p no:cacheprovider
          echo "PASS：护栏层已确认编入产物"

      # ★ 私钥绝不能出现在仓库里。
      #   一旦入库，任何人都能签发激活码，授权体系瞬间失效，
      #   且 Git 历史无法真正清除（后续删除，commit 里仍在）。
      - name: Assert private key is absent
        run: |
          set -euo pipefail
          # ★ 一次判断，不要 grep 串联 ——
          #   `grep -Ei 'a|\.pem$' | grep -i private` 里第一个分支已匹配全部
          #   .pem，第二个分支再过滤，绕一圈等于没过滤。
          #   直接按文件名含 private 判定。
          HIT=$(git ls-files | grep -i 'private' || true)
          if [ -n "$HIT" ]; then
            echo "::error::检测到疑似私钥被 git 追踪 —— 立即处理，视为安全事故"
            echo "$HIT"
            exit 1
          fi
          echo "PASS：私钥未被追踪"

      # 公钥必须在（build_engine.py 打包时要读它）
      # ★ 位置随 tools/ 移出而变更：公钥现在随包分发，放在包内。
      - name: Assert public key is present
        run: |
          set -euo pipefail
          PUB=src/daoti_xuandun_personal/license_pub.pem
          test -f "$PUB" \
            || { echo "::error::公钥缺失，干净 clone 上无法构建"; exit 1; }
          grep -q "BEGIN PUBLIC KEY" "$PUB" \
            || { echo "::error::公钥内容不是有效 PEM"; exit 1; }
          echo "PASS：公钥已入库且格式正确"

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            target: x86_64-pc-windows-msvc
            bundle: nsis
            bundle_glob: '*.exe'
          - os: macos-14
            name: macOS arm64
            target: aarch64-apple-darwin
            bundle: dmg
            bundle_glob: '*.dmg'
          - os: ubuntu-22.04
            name: Linux x64
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            bundle_glob: '*.AppImage'

    runs-on: ${{ matrix.os }}

    # ★★ 整个 job 强制 UTF-8。
    #   windows-latest 的控制台编码是 GBK（cp936），
    #   任何中文提示里的「→」「★」都会让 print 抛
    #   UnicodeEncodeError: 'charmap' codec can't encode characters
    #   把构建打断 —— 表面看是「Build Nuitka engine 退出码 1」，
    #   真实原因却与编译毫无关系，极难定位。
    #   在 job 级设置，Nuitka 等子进程也会继承。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      # ★ 各平台用该平台的 Rust 工具链。macOS runner 是 arm64，
      #   显式指定 aarch64-apple-darwin 而不用默认工具链，
      #   否则会按 x86_64 交叉编译，产物在 M 系列机器上跑不起来。
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Linux 打包 AppImage 需要这些系统库。
      # 缺 libwebkit2gtk 会报 "Required library 'webkit2gtk-4.1' not found"。
      #
      # ★ APPIMAGE_EXTRACT_AND_RUN=1 是**必须**的，不是优化：
      #   AppImage 运行时必须用 FUSE 把自身挂载出来才能执行，
      #   而 GitHub 的 ubuntu runner 跑在容器里，/dev/fuse 不可用
      #   （典型报错 "failed to run linuxdeploy" —— linuxdeploy 本身
      #   是个 AppImage，它挂载不上去就直接死给你看）。
      #   这个变量让它改成「解包到临时目录再运行」，绕开 FUSE。
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # ★ 钉死 Nuitka 版本：版本漂移会改变构建行为
          #   （含 ccache 下载策略），历史上因此出现过「同样的代码构建失败」。
          pip install "nuitka==4.1.3"
          pip install -e .

      # ★★ UTF-8 输出自检 —— 在**真实 runner 环境**里验证。
      #   这条不是多余：Windows runner 默认 GBK，中文里的「→」「★」
      #   会让 print 抛 UnicodeEncodeError，把构建打断成
      #   「Build Nuitka engine 退出码 1」，而真实原因与编译无关。
      #   在这里先跑一次同样的输出，编码有问题就会立刻暴露，
      #   而不是等十分钟后从 Nuitka 失败里反推。
      #
      #   用 shell: bash 是刻意的 —— GitHub 默认的 pwsh 也会走 UTF-8，
      #   反而复现不出 GBK 环境；bash + 无 PYTHONIOENCODING 才接近
      #   runner 的默认状态。
      - name: Verify UTF-8 output
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          print("编码自检：护栏层已就位 → 将编入 ★")
          sys.stderr.write("[FATAL] 找不到护栏层源码，构建中止。\n")
          enc = (sys.stdout.encoding or "").lower().replace("-", "")
          print(f"stdout 编码 = {sys.stdout.encoding}")
          if enc not in ("utf8", "cp65001"):
              print(f"::error::stdout 编码是 {sys.stdout.encoding}，不是 UTF-8")
              sys.exit(1)
          PY
          echo "PASS：UTF-8 输出正常"

      # ★ Nuitka 必须在目标平台本机跑 —— 它调用的是本机 C 编译器，
      #   不能交叉编译。所以这里是三个 runner 各自编译，不是编译三份。
      - name: Build Nuitka engine
        working-directory: desktop
        # 缺公钥时该脚本 return 4 —— 这里不做绕过。
        # 公钥缺失就是发布阻断，不是可选项。
        run: python build_engine.py

      - name: Assert public key landed in bundle
        working-directory: desktop
        # ★ 这条断言是本 workflow 存在的核心理由。
        #   build_engine.py 会拷公钥，但「脚本说拷了」不等于「真的拷了」。
        #   断言产物目录里确实有它，才算闭环。
        #
        # ★★ 用 Python 判断，不用 shell。
        #   两版都踩过坑：
        #     · test -f 相对路径 → Windows runner 上正斜杠路径失败
        #     · FOUND=$(find ...) → set -u 下 find 无匹配即 unbound variable
        #       （回归：2026-09-28 三平台同时挂在这一行，
        #        报错是 "FOUND: unbound variable"，而产物其实在）
        #   shell 判据在三平台上的差异比它解决的问题还多。
        #   Python 的 Path 语义跨平台一致，且能顺手把目录内容打进日志。
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          roots = [Path("src-tauri/resources/engine"), Path("engine_main.dist")]
          hits = [p for r in roots if r.is_dir()
                  for p in r.rglob("license_pub.pem")]
          if not hits:
              print("::error::引擎产物里没有 license_pub.pem —— 所有用户都将无法激活")
              for r in roots:
                  print(f"  {r} 存在={r.is_dir()}")
                  if r.is_dir():
                      for p in sorted(r.iterdir())[:20]:
                          print(f"    {p.name}")
              sys.exit(1)
          print(f"PASS：公钥已落入引擎产物（{hits[0]}）")
          PY

      # ★★★ 产物级护栏断言（本 workflow 最关键的一步）
      #
      #   前面所有检查都是「源码/配置对不对」，这一条是
      #   「**编译出来的二进制里到底还有没有防护能力**」。
      #
      #   护栏的 import 是延迟 import，Nuitka 静态分析看不到它；
      #   而判定护栏在不在场的路径曾指向仓库外的企业版目录 ——
      #   本地恰好有那个目录所以一直带着，干净 clone（= runner）
      #   上却静默跳过，产出没有提示词注入与敏感泄露检测的包，
      #   界面还照常显示「防护中」。用户以为自己受保护。
      #
      #   ★ 判据：在二进制里搜护栏的判据标识。
      #     不能找 .py 文件 —— Nuitka standalone 把模块编译进二进制，
      #     dist/daoti_xuandun/ 下只剩 data 文件，源码根本不出现。
      #     也不能只看目录存在 —— 空壳目录同样满足，而它毫无防护能力。
      #     判据标识（如 system_prompt_inject / sensitive_leak）
      #     只由护栏代码产生，护栏缺失时必然搜不到。
      - name: Assert guardrail is present in compiled engine
        working-directory: desktop
        # ★★ 同样用 Python，不用 shell。
        #   `MISSING="$MISSING $sig"` 在 set -u 下首次赋值前引用未定义变量
        #   会直接报错退出 —— 与 FOUND 同一个坑，不重复踩。
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          roots = [Path("src-tauri/resources/engine"), Path("engine_main.dist")]
          bins = [p for r in roots if r.is_dir()
                  for p in r.iterdir()
                  if p.is_file() and p.suffix in (".exe", ".bin")]
          if not bins:
              print("::error::在引擎产物目录里找不到可执行文件")
              for r in roots:
                  print(f"  {r} 存在={r.is_dir()}")
                  if r.is_dir():
                      for p in sorted(r.iterdir())[:20]:
                          print(f"    {p.name} ({'dir' if p.is_dir() else p.stat().st_size}B})")
              sys.exit(1)

          # ★ 这些标识只由护栏代码产生，个人版自研层不包含它们。
          #   缺了就证明护栏没编进来 —— 产物能启动、能自检通过，
          #   但提示词注入与敏感泄露两类检测完全失效，
          #   而界面照常显示「防护中」。用户以为自己受保护。
          sigs = [b"system_prompt_inject", b"sensitive_leak"]
          for b in bins:
              data = b.read_bytes()
              missing = [s.decode() for s in sigs if s not in data]
              print(f"检查产物: {b}  ({len(data) / 1024 / 1024:.1f} MB)")
              if missing:
                  print(f"::error::{b.name} 里缺少护栏判据标识：{' '.join(missing)}")
                  print("::error::护栏未编入这个包。发布一个没有防护能力的防火墙，")
                  print("::error::比构建失败坏得多 —— 前者让用户产生错误的安全感。")
                  sys.exit(1)
              print(f"PASS：{b.name} 内含护栏判据，防护能力在位")
          PY

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        # ★ 必须显式指定 --bundles，且传的是**格式名**（nsis/dmg/appimage）
        #   而不是通配符 —— 命令行不接受 glob。
        #   各平台只能构建自己支持的格式，传 all 会让 macOS runner
        #   尝试产出 .exe 而失败。
        #
        # ★ APPIMAGE_EXTRACT_AND_RUN 对 Linux 是**必须**的：
        #   Tauri 的 AppImage 打包依赖 linuxdeploy，而 linuxdeploy
        #   本身是个 AppImage —— 它必须用 FUSE 把自身挂载出来才能跑。
        #   GitHub 的 ubuntu runner 在容器里，/dev/fuse 不可用，
        #   于是 linuxdeploy 挂载失败，报出来的是
        #   「failed to run linuxdeploy」—— 一个看不出真实原因的错误。
        #   这个变量让它解包到临时目录再执行，绕开 FUSE。
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xuandun-personal-${{ matrix.target }}
          path: desktop/src-tauri/target/release/bundle/**/${{ matrix.bundle_glob }}
          # 空产物必须报错：上传 0 个文件却显示成功，
          # 会让后续 release 创建一个没有任何安装包的版本。
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # ★ 三种格式都要算。只认 *.exe 的话，macOS/Linux 用户
          #   拿不到任何校验值 —— 而校验值恰恰是他们最需要的
          #   （从第三方下载时无法确认文件未被篡改）。
          find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" \) \
            -exec sha256sum {} \; \
            | sed 's|  \./[^ ]*/|  |' > checksums-sha256.txt
          cat checksums-sha256.txt
          # 一个都没算出来就是失败：静默产出空校验文件比报错更糟，
          # 用户会以为「没校验值也能装」。
          test -s checksums-sha256.txt \
            || { echo "::error::未找到任何安装包，校验文件为空"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/checksums-sha256.txt
