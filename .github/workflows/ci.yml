# SPDX-License-Identifier: DaoTi-Research-1.0
# 个人版 CI — 公开版（脱敏）
#
# 为什么不直接放行原 ci.yml
# ─────────────────────────────────────────────────────────────
# 原配置逐条列出了防护门禁的名称、判据与失败模式，
# 公开它等于告诉破解者「我们重点防什么、怎么防的」。
# 那是 2026-09-28 把它移出仓库的原始理由，不该被绕开。
#
# 这一版保留的是**验证行为**，去掉的是**情报**：
#   · 仍会在每次 push 上跑测试，红了会挡住后续提交
#   · 但不出现任何门禁名称、判据、检查项的具体所指
#   · 失败时只报「哪条测试挂了」，不解释它在防什么
#
# ★ 这样取舍的代价必须说清：
#   公开 CI 能发现「测试挂了」，但**不能**替代本地那套
#   更严格的门禁（后者仍在本地运行，不公开）。
#   公开 CI 是第一道网，不是唯一一道。

name: CI Validation

on:
  push:
    branches: [main, 'dev/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      # ★ P1-19/P1-26：与 release.yml 保持一致 ——
      #   ① 所有 action 钉 40 位 commit SHA，不用浮动 tag
      #      （tag 可被移动，`@v5` 等于把构建交给上游随时改写）；
      #   ② 出网策略从 audit 收紧为 block：这个 job 的依赖面很小
      #      （pip + 取仓库），allowlist 可核准；比"只审计不拦截"更实在。
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pytest
          pip install -e .

      # ★ 版本号唯一真实来源是 desktop/src-tauri/Cargo.toml。
      #   漏同步会让侧边栏 / 诊断报告 / 引擎 version 各说各话，
      #   而这类不一致不会被任何功能测试发现。
      - name: Assert version consistency
        run: python .github/scripts/sync_version.py --check

      # ★ 门禁 1-4 仍在本地 CI（.github/workflows/ci.yml 完整版，未公开）运行。
      #   这里只跑「不依赖未公开资源」的那部分，
      #   避免公开仓库 clone 后因缺文件而恒红 ——
      #   一个恒红的 CI 等于没有 CI：久而久之没人看它。
      - name: Run test suite
        run: python -m pytest tests -q --no-header -p no:cacheprovider
        timeout-minutes: 15

  # ══════════════════════════════════════════════════════════
  # 桌面端：前端构建 + Rust 类型检查
  # ══════════════════════════════════════════════════════════
  # ★★ P1-10（2026-10-29 第三轮审查）：这两步此前**完全不在 CI 里**。
  #   证据是真实的：vite 从 5.4.21 跳到 8.3.5（跨三个主版本）期间
  #   三个 PR 全绿 —— 因为没有任何 job 执行过 `npm run build`。
  #   同一个洞让 `cargo check` 级别的错误只在发 tag 之后才暴露。
  #
  # ★ 为什么放在 windows-latest 而不是 ubuntu：
  #   Tauri 的 Linux 构建要 apt 装 libwebkit2gtk 等系统库（需要出网到
  #   ubuntu 源），而本工作流的出网策略是 block + 允许清单。
  #   Windows runner 自带 Rust / Node 与 WebView2 开发头，
  #   整条链只需要 registry.npmjs.org 与 crates.io 两类白名单主机。
  desktop:
    name: Desktop (frontend build + rust check)
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            registry.npmjs.org:443
            nodejs.org:443
            index.crates.io:443
            static.crates.io:443
            crates.io:443
            static.rust-lang.org:443
            sh.rustup.rs:443

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # v1.0.6
        with:
          toolchain: stable

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # 必须用 npm 脚本而不是裸 `vite build`：`npm run build` = tsc + vite build，
      # 类型错误与技术栈版本不兼容都会在这里暴露。
      - name: Build frontend
        working-directory: desktop
        run: npm run build

      # ★★ 2026-10-29（实测）：`tauri_build::build()` 会在**编译期**校验
      #   `bundle.resources` 里声明的路径是否存在。本项目声明的是
      #   `resources/engine`（Nuitka 产物目录，由 build_engine.py 生成、
      #   不入库），干净 clone 上它不存在 —— 于是 cargo check 抛
      #   「failed to run custom build command」而没有任何可读原因。
      #   这里给一个空目录占位：本 job 只验证类型与依赖，不验证产物。
      - name: Create resource placeholders for cargo check
        shell: pwsh
        working-directory: desktop
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/engine | Out-Null
          Set-Content -Path src-tauri/resources/engine/.placeholder -Value ""

      # ★★ 顺序不能反：tauri 的 generate_context! 在**编译期**要求
      #   frontendDist（../dist）存在，而 dist/ 不入库。
      #   先构建前端再 cargo check，仓库里不需要提交任何构建产物。
      - name: Check Rust
        working-directory: desktop/src-tauri
        run: cargo check --locked
        timeout-minutes: 20
