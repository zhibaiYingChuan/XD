name: CI Validation

on:
  push:
    branches: [main, 'dev/**', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 并发控制：同一分支只运行最新一次，旧的自动取消
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# HCSE PHASE 4: 默认最小权限，每个job单独声明额外权限
permissions:
  contents: read

jobs:
  # ============ Job 1: 版本一致性校验 (SSOT Gate) ============
  version-check:
    name: Version Consistency Check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner (HCSE Hardening)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Run sync_version.py --check (SSOT gate)
        working-directory: desktop/xuandun-desktop
        run: python sync_version.py --check

  # ============ Job 2: Python 后端测试 + 回归 ============
  python-test:
    name: Python Backend Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install numpy pytest pip-audit bandit
          pip install -e ".[engine]"

      # P0 修复：CI 环境编译 Rust 扩展（双梯形镜像递归网络）
      - name: Setup Rust 1.94.0 (与本地构建环境对齐)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.0

      - name: Install maturin and build Rust extension
        run: |
          pip install maturin>=1.7
          maturin build --release --manifest-path crates/daoti_xuandun_pyo3/Cargo.toml
          pip install --force-reinstall target/wheels/*.whl

      - name: Run config smoke test (确保config.py参数化正确加载)
        run: |
          python << 'PYEOF'
          from daoti_xuandun import XuanDunConfig, DefenseLevel
          # 验证v1.3.1新增参数存在且默认值正确
          cfg = XuanDunConfig()
          assert hasattr(cfg, 'natural_lang_printable_ratio_threshold'), 'Missing printable ratio param'
          assert hasattr(cfg, 'natural_lang_entropy_low'), 'Missing entropy low param'
          assert hasattr(cfg, 'natural_lang_entropy_high'), 'Missing entropy high param'
          assert hasattr(cfg, 'luoshu_poisoning_total_updates_cap'), 'Missing GateC cap param'
          assert cfg.luoshu_poisoning_total_updates_cap == 500, f'Expected 500 got {cfg.luoshu_poisoning_total_updates_cap}'
          assert cfg.natural_lang_entropy_low == 2.5
          assert cfg.natural_lang_entropy_high == 6.8
          # 验证v1.3.2双梯形参数
          assert hasattr(cfg, 'bilateral_num_layers'), 'Missing bilateral_num_layers'
          assert hasattr(cfg, 'bilateral_state_dim'), 'Missing bilateral_state_dim'
          assert hasattr(cfg, 'bilateral_t_iter'), 'Missing bilateral_t_iter'
          print('PASS: XuanDunConfig v1.3.2 params OK')
          PYEOF

      - name: Run all regression tests (含 test_xuandun + test_reject_gate)
        run: |
          python -m pytest tests/ -v --timeout=300
        timeout-minutes: 15

      # ---- 代码安全扫描门禁（P1 代码安全治理）----
      - name: bandit - Python 代码安全扫描
        run: |
          # 排除 benchmark 测试工具目录（含攻击样本文本与 subprocess，非生产运行时）
          # 跳过 B105(枚举'PASS'误报)/B110/B112(异常风格LOW)，
          # 中高危项(B104 bind 0.0.0.0 / B310 urlopen)已在源码用 nosec + scheme 白名单处理
          python -m bandit -r src -x src/daoti_xuandun/benchmark -s B105,B110,B112
        timeout-minutes: 5

      - name: pip-audit - Python 依赖漏洞扫描
        run: |
          # 扫描当前已安装环境（含项目依赖），仅允许 0 个已知漏洞
          python -m pip_audit --local
        timeout-minutes: 5

  # ============ Job 3: Rust 静态检查 + 编译 ============
  rust-clippy:
    name: Rust Clippy + Check
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Rust 1.94.0 (与本地构建环境对齐)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3 (Node.js 24)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/xuandun-desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('desktop/xuandun-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      # HCSE: 检查P0-1 CDP端口是否仅debug模式开启
      - name: Verify CDP debug port gated by cfg!(debug_assertions) (P0-1 Compliance)
        shell: pwsh
        run: |
          $mainRs = Get-Content "desktop\xuandun-desktop\src-tauri\src\main.rs" -Raw
          if ($mainRs -match 'set_var\("WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS".*?9224') {
            # 检查是否被 debug_assertions 条件保护
            if ($mainRs -match 'cfg!\(debug_assertions\)') {
              Write-Host "PASS: CDP port appears to be gated by debug_assertions or explicit env var"
            } else {
              Write-Host "FAIL: CDP debug port 9224 is UNCONDITIONALLY set in release builds! This is P0-1 CRITICAL SECURITY RISK."
              exit 1
            }
          } else {
            Write-Host "INFO: WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS not found in main.rs (skipped)"
          }

      # 根源修复：tauri::generate_context!() 编译时要求 frontendDist ("../dist") 路径存在，
      # 但 Rust job 与 TypeScript build job 并行运行，dist 尚未构建。
      # 创建占位 dist 目录满足编译期检查，后续 ts-build job 会覆盖真实 dist。
      - name: Create placeholder dist/ for tauri::generate_context!()
        shell: pwsh
        run: |
          $distDir = "desktop\xuandun-desktop\dist"
          if (-not (Test-Path $distDir)) {
            New-Item -ItemType Directory -Path $distDir -Force | Out-Null
            Set-Content -Path "$distDir\index.html" -Value "<html><body><!-- placeholder for CI --></body></html>"
            Write-Host "Created placeholder dist/index.html"
          } else {
            Write-Host "dist/ already exists, skipping"
          }

      # 根源修复：externalBin 引入后，tauri::generate_context!() 编译期会校验
      # src-tauri/binaries/ 下的引擎二进制存在。Rust job 不构建引擎（Nuitka 由 release 构建），
      # 因此创建占位二进制满足编译期校验，打包时由 release.yml 的 build_engine.py 覆盖真实引擎。
      - name: Create placeholder engine binary for externalBin
        shell: pwsh
        run: |
          $binDir = "desktop\xuandun-desktop\src-tauri\binaries"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          $placeholder = Join-Path $binDir "xuandun-engine-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $placeholder)) {
            # pwsh 7 不支持 Set-Content -Encoding Byte，改用 WriteAllBytes 写最小占位文件
            [System.IO.File]::WriteAllBytes($placeholder, [byte[]](0))
            Write-Host "Created placeholder engine binary: $placeholder"
          } else {
            Write-Host "Engine binary already exists, skipping"
          }

      # 根源修复：tauri.conf.json 的 bundle.resources 引用 "resources/engine"（Nuitka 打包目录），
      # cargo check 编译期会校验该路径存在。CI 的 rust job 不打包引擎（Nuitka 由 release 构建），
      # 因此创建占位目录满足编译期校验，打包时由 release.yml 的 build_engine.py 生成真实引擎目录。
      - name: Create placeholder resources/engine dir for cargo check
        shell: pwsh
        run: |
          $resDir = "desktop\xuandun-desktop\src-tauri\resources\engine"
          if (-not (Test-Path $resDir)) {
            New-Item -ItemType Directory -Path $resDir -Force | Out-Null
            Write-Host "Created placeholder resources/engine directory"
          } else {
            Write-Host "resources/engine already exists, skipping"
          }

      - name: cargo audit - Rust 依赖漏洞扫描
        shell: pwsh
        continue-on-error: true
        run: |
          # 安装 cargo-audit 并扫描 Cargo.lock，发现漏洞仅警告不阻断
          # 第三方依赖漏洞非本项目代码问题，阻断 CI 会影响开发效率
          # 注意：--db 需要指定漏洞数据库路径，不传 -d 参数（cargo audit 无 -d 简写）
          cargo install cargo-audit --locked
          cargo audit
        working-directory: desktop/xuandun-desktop/src-tauri
        timeout-minutes: 10

      - name: Cargo check (语法 + 类型检查)
        working-directory: desktop/xuandun-desktop/src-tauri
        run: cargo check --release

      - name: Cargo clippy (零警告门禁 -D warnings)
        working-directory: desktop/xuandun-desktop/src-tauri
        run: cargo clippy --release -- -D warnings

      # P0 修复：PyO3 扩展 crate 编译验证
      - name: Cargo check (PyO3 扩展 - 双梯形递归网络)
        working-directory: crates/daoti_xuandun_pyo3
        run: cargo check --release

      - name: Cargo clippy (PyO3 扩展 - 零警告门禁)
        working-directory: crates/daoti_xuandun_pyo3
        run: cargo clippy --release -- -D warnings

  # ============ Job 4: TypeScript 前端构建 + 单元测试 ============
  ts-build:
    name: TypeScript Build + Vitest
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node 20 LTS (与本地 v20.12.2 对齐)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/xuandun-desktop/package-lock.json

      - name: Install npm dependencies (ci = 严格按lock文件，保证可重现)
        working-directory: desktop/xuandun-desktop
        run: npm ci

      # HCSE PHASE 6: README代码块示例 + examples编译验证
      - name: Verify tauri.conf.json CSP configuration (桌面端绝对要求3)
        shell: bash
        run: |
          CSP=$(node -e "console.log(require('./desktop/xuandun-desktop/src-tauri/tauri.conf.json').app.security.csp)")
          echo "Current CSP connect-src part: $CSP"
          for ENDPOINT in "ipc.localhost" "localhost:18765" "localhost:18766"; do
            if echo "$CSP" | grep -q "$ENDPOINT"; then
              echo "PASS: CSP contains $ENDPOINT"
            else
              echo "FAIL: CSP MISSING $ENDPOINT (release mode will white-screen!)"
              exit 1
            fi
          done

      - name: Verify Cargo.toml tauri custom-protocol feature (桌面端绝对要求4)
        shell: bash
        run: |
          if grep -q 'custom-protocol' desktop/xuandun-desktop/src-tauri/Cargo.toml; then
            echo "PASS: Cargo.toml declares custom-protocol feature"
          else
            echo "FAIL: Cargo.toml MISSING tauri custom-protocol feature"
            exit 1
          fi

      - name: Run Vitest (前端单元测试)
        working-directory: desktop/xuandun-desktop
        run: npm run test

      - name: TypeScript build (tsc + vite build)
        working-directory: desktop/xuandun-desktop
        run: npm run build

      - name: Verify dist/ output exists (前端产物检查)
        run: |
          test -f desktop/xuandun-desktop/dist/index.html && echo "PASS: dist/index.html exists"
          test -d desktop/xuandun-desktop/dist/assets/ && echo "PASS: dist/assets/ exists"
