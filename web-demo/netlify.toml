[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 路由回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API 代理（生产环境需替换为实际后端地址）
[[redirects]]
  from = "/api/*"
  to = "https://xuandun-demo-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
