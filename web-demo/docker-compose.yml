version: '3.8'

# 道体·玄盾 Web Demo 全栈部署
# 使用方式：在项目根目录执行 docker-compose -f web-demo/docker-compose.yml up -d
services:
  backend:
    build:
      context: ..  # 项目根目录（需要访问 src/ 核心算法源码）
      dockerfile: web-demo/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=*
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 核心算法保护：不挂载源码卷，源码仅在镜像内部
    # 生产环境建议：使用私有镜像仓库，不公开推送

  frontend:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
