# 响应侧检测规则（外置）
# ══════════════════════════════════════════════════════════════
# 为什么要外置：
#   此前 88 条判据全部是 Python 源码字面量。改一条要重新 Nuitka
#   打包（约 10 分钟），而且攻击方只要拿到源码就知道规则表在哪。
#   外置后：改规则不动代码、不用重编，且规则表本身不含敏感逻辑。
#
# 误报控制靠每条规则的 min_matches（同时出现几次才算载荷），
# 而非「出现即高危」—— 正常的俄语正文里也会有零宽字符，
# 正常的讲解里也会提到 delete 方法。
#
# 新增规则只需在此追加，无需改动任何 Python 代码。
#
# ⚠️ 以下章节**当前未被代码读取**（检测器用的是 verifier.py 里的同名常量）：
#     invisible_chars / html_hidden / unicode_steganography /
#     prompt_inject / sensitive_leak / watermark
#   只有下列三节是**生效**的（经 verifier._rules() 读取，空则回退内置表）：
#     dangerous_commands / sensitive_paths / dangerous_urls
#   修改上面那六节不会有任何运行时效果 —— 改它们之前请先把它接到代码上，
#   或直接改 verifier.py 的同名常量。此处保留全文仅为「规则清单可见」。

version: 3
updated: "2026-09-27"

# ── 危险命令 ──────────────────────────────────────────────
# 判据来源：响应文本自身（含 tool_call 参数）
# 说明：这些是「写法本身就危险」的命令，不依赖上下文，
#       因此误报率天然低。变量拼接等绕过由 baseline 差分兜底。
dangerous_commands:
  - pattern: '\brm\s+-[rf]{1,2}\b'
    label: 递归删除命令 rm -rf
  - pattern: '\bmkfs(\.\w+)?\b'
    label: 文件系统格式化 mkfs
  - pattern: '\bdd\s+if='
    label: 磁盘覆写 dd if=
  - pattern: '\bchmod\s+777\b'
    label: 权限全开 chmod 777
  - pattern: ':\(\)\s*\{.*\};\s*:'
    label: fork 炸弹
  - pattern: '\bformat\s+[a-z]:'
    label: Windows 磁盘格式化
  - pattern: '\bdel\s+/[sfq]\b'
    label: Windows 递归删除
  - pattern: '\bDrop\s+(table|database)\b'
    label: SQL 删库
  - pattern: '\btruncate\s+table\b'
    label: SQL 截断表
  - pattern: '\beval\s*\('
    label: 动态代码执行 eval
  - pattern: '\bexec\s*\('
    label: 动态代码执行 exec
  - pattern: '\b(?:curl|wget)\b[^\n|;]*\|\s*(?:ba)?sh\b'
    label: 下载并执行远程脚本（curl|sh）
  - pattern: '\b(?:curl|wget)\b[^\n]*\b(?:\.onion|ngrok|pipedream|webhook\.site)\b'
    label: 向可疑地址发起请求
  - pattern: '\bnc\b\s+-[a-z]*e\b|\bnetcat\b\s+-[a-z]*e\b'
    label: 反弹 shell（nc -e）
  # 无外部二进制的反弹 shell：现代脚本最常见写法，
  # 原规则表只覆盖 nc -e，实测漏放 bash -i >& /dev/tcp/...
  - pattern: '/dev/(?:tcp|udp)/[\w.:-]+'
    label: 反弹 shell（内建 /dev/tcp 重定向）
  - pattern: '\b(?:ba|z|k|da)?sh\b\s+-i\b[^\n]*&'
    label: 反弹 shell（交互式 shell 重定向）
  - pattern: '\bpython\s+-c\b[^\n]*(?:socket|subprocess|os\.system)'
    label: Python 内联执行危险操作
  - pattern: '\bbase64\s+-d\b[^\n]*\|\s*(?:ba)?sh\b'
    label: Base64 解码后执行

# ── 敏感文件路径 ──────────────────────────────────────────
sensitive_paths:
  - pattern: '/etc/(passwd|shadow|sudoers)\b'
    label: 读取系统账户文件
  - pattern: '\.ssh/(id_rsa|id_ed25519|authorized_keys)\b'
    label: 读取 SSH 私钥
  - pattern: '\.aws/credentials\b'
    label: 读取 AWS 凭证
  # ★★ 2026-10-04（误报修复）：必须排除 `process.env.X` / `os.environ`。
  #   旧写法 '\.env(\.|$|\s)' 会把 JS/TS 最常见的 `process.env.PORT`
  #   判成「读取 .env 文件」→ 阻断，而那是编程助手回答里的正常写法。
  - pattern: '(?<![A-Za-z0-9_])\.env\b'
    label: 读取环境变量文件
  - pattern: '\.docker/config\.json\b'
    label: 读取 Docker 凭证
  - pattern: '\.git/config\b'
    label: 读取 Git 配置
  - pattern: '\.npmrc\b|\.pypirc\b'
    label: 读取包管理凭证
  - pattern: 'cookies?\.txt\b|login\.json\b'
    label: 读取浏览器凭证

# ── 危险外部端点 ──────────────────────────────────────────
dangerous_urls:
  - pattern: 'https?://(?!localhost|127\.0\.0\.1)[\w.-]*(?:ngrok|pipedream|requestbin|webhook\.site|burpcollaborator|interact\.sh)\.(?:com|net|io|sh)'
    label: 数据外泄测试平台 URL
  - pattern: 'https?://[\w.-]*\.(?:tk|ml|ga|cf|gq)\b'
    label: 免费域名（常见于 C2）

# ── 不可见字符 ────────────────────────────────────────────
# min_matches：单个零宽字符可能是正常排版，连续出现才是隐写载荷
invisible_chars:
  - pattern: '[‌⁠﻿]'
    label: 零宽空格/连接符
    severity: medium
  - pattern: '­'
    label: 软连字符（防关键词绕过）
    severity: medium
  - pattern: '᠎'
    label: 蒙古文零宽字符（常见于提示注入）
    severity: medium
  - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f]'
    label: 控制字符
    severity: medium
  - pattern: '[‪-‮⁦-⁩]'
    label: 双向文本控制符（可欺骗人工阅读）
    severity: medium
  # U+200C (ZWNJ) 此前遗漏，而它与 U+200B/U+200D 组合
  # 正是二进制隐写的标准载体（U+200B=0 / U+200C=1 / U+200D 终止）
  - pattern: '[‌⁡⁢⁣⁤]'
    label: 零宽连接符/方向标记
    severity: medium

# ── HTML 隐藏元素 ─────────────────────────────────────────
html_hidden:
  - pattern: '<[^>]*style\s*=\s*["''][^"'']*(?:display\s*:\s*none|visibility\s*:\s*hidden|font-size\s*:\s*0)'
    label: HTML 隐藏元素
  - pattern: '<!--(?!-->)[\s\S]{0,500}?-->'
    label: HTML 注释（可能含隐藏指令）
  - pattern: '<meta[^>]*http-equiv\s*=\s*["'']refresh'
    label: HTML meta 刷新跳转

# ── Unicode 隐写 ──────────────────────────────────────────
# 2025-2026 实证的 stealth 攻击主流：人眼渲染正常，
# 模型 tokenizer 却能还原成可执行指令。
unicode_steganography:
  # Tags 块 U+E0000-U+E007F：渲染为完全空白，每个字符 = 0xE0000 + ASCII
  # 连续 4 个以上才判定（单个 Tags 字符可能是合法 ISO 语言标签）
  - kind: run
    pattern: '[\U000E0000-\U000E007F]{4,}'
    label: Unicode Tags 块隐写
    decode: unicode_tags
    severity: high
  # 变体选择符 U+E0100-E01EF / VS1-16
  - kind: run
    pattern: '(?:[\U000E0100-\U000E01EF]|[︎️]){4,}'
    label: 变体选择符连发隐写
    severity: high
  # 同形异义字：西里尔字母混入拉丁为主的文本
  # 判据必须是「西里尔占比 < 25%」而非绝对数量 ——
  # 俄语正文里夹几个拉丁产品名是常态，按绝对数量会大量误报。
  - kind: ratio
    suspects: 'аеорсухАЕОРСТХіјһАВЕКМНОРСТХԁһАВЕКМНОРСТХѕАВЕІКМНОРСТХԛԝАВЕКМНОРСТХ'
    script_range: [1024, 1279]
    max_ratio: 0.25
    min_letters: 12
    label: 西里尔同形异义字绕过
    severity: high

# ── 提示词注入 / 敏感泄漏（分类判据）────────────────────
prompt_inject:
  - pattern: '(?:my\s+instructions?|your\s+configuration|system\s+prompt|系统提示词|系统指令|系统设置|内部指令)'
    label: 系统提示词注入特征
  - pattern: 'ignore\s+(?:all\s+)?(?:previous|prior|above)\s+instructions?'
    label: 忽略先前指令
  - pattern: '忽略(?:之前|以上|前面)(?:的)?(?:所有)?(?:指令|规则|提示)'
    label: 忽略先前指令（中文）

sensitive_leak:
  # ★ 字符类必须含 '-'：sk-proj- / sk-svcacct- 是现役格式，
  #   不含 '-' 只能匹配老格式，现代密钥全部漏放。
  #
  # ★★ 2026-10-04（误报修复）：前缀必须带左边界 (?<![A-Za-z0-9_])。
  #   无边界时 `sk-` 会匹配到普通英文复合词中间
  #   （risk-assessment-… / task-orchestration-… / disk-usage-…），
  #   把正常回答判成「敏感信息泄露」并拦截（用户实测 id=2059 即此）。
  #   ⚠️ 注意：本节的生效副本在 verifier.py::ResponseVerifier._SENSITIVE_LEAK_RE，
  #   改这里不会立刻生效（见文件头说明）。
  - pattern: '(?<![A-Za-z0-9_])sk-[A-Za-z0-9\-_]{20,}'
    label: OpenAI 风格密钥
  - pattern: '(?<![A-Za-z0-9])AKIA[0-9A-Z]{16}'
    label: AWS Access Key
  - pattern: '-----BEGIN\s+\w*\s*PRIVATE KEY-----'
    label: PEM 私钥
  - pattern: 'eyJ[A-Za-z0-9\-_]{8,}\.eyJ'
    label: JWT 令牌

# ── 信誉：水印特征（中转站自述留存数据）─────────────────
watermark:
  - pattern: '[\u4e00-\u9fa5]{0,4}(?:本平台|本站|本站点)(?:保留|存储|记录|留存)'
    label: 中转站自述保留数据
  - pattern: '(?:conversation|chat)[-_ ]?(?:log|history)[\s_-]?(?:saved|retained|kept)'
    label: 会话历史留存声明
  - pattern: 'for\s+(?:training|improvement|analysis)\s+purposes?'
    label: 训练用途声明
  - pattern: '(?:we|i)\s+(?:may|will|reserve)\s+the\s+right\s+to\s+(?:store|retain|log)'
    label: 数据留存权声明
  - pattern: '(?:powered|provided|served)\s+by\s+[\w.-]+\s*(?:relay|proxy|gateway)'
    label: 中转站标识
  - pattern: '[\u4e00-\u9fa5]{0,6}(?:转发|代理|中转)(?:服务|站|节点)'
    label: 中转服务标识
  - pattern: '\bthird[- ]party\s+(?:provider|relay|service)\b'
    label: 第三方中转声明

# ── 严重度 → 处置 映射（与安全级别交叉）──────────────────
# 复用 verifier 原有的级别 × 严重度表，此处仅声明映射来源，
# 保证规则外置后处置口径仍与代码内一致。
severity_map:
  high: { lenient: alert, balanced: block, strict: block }
  medium: { lenient: pass, balanced: alert, strict: block }
  low: { lenient: pass, balanced: pass, strict: pass }
