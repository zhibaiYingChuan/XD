[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daoti-xuandun"
version = "1.3.3-beta"
description = "道体玄盾 - 轻量级AI运行时安全网关"
readme = "README.md"
authors = [{ name = "独立研究者，知白" }]
license = { text = "DaoTi-Research-1.0 (core) + Apache-2.0 (periphery)" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/zhibaiYingChuan/XD"
Repository = "https://github.com/zhibaiYingChuan/XD.git"

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
engine = ["flask>=3.0", "waitress>=3.0"]
# Sprint 2b: 反向代理网关依赖（FastAPI + uvicorn + httpx 流式透传）
# POC 结论：waitress 同步 WSGI 无法透传 SSE（hop-by-hop header 限制），
# 必须使用 FastAPI + uvicorn + httpx.AsyncClient(stream=True) 异步方案
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx[http2]>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "PyJWT>=2.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
where = ["src"]

# ── 双梯形镜像递归网络 Rust 扩展（maturin） ──
# 用 PyO3 将 Rust 算法编译为 Python 可调用的原生扩展模块
# 模块名 daoti_xuandun_pyo3，源码位于 crates/daoti_xuandun_pyo3
[tool.maturin]
manifest-path = "crates/daoti_xuandun_pyo3/Cargo.toml"
module-name = "daoti_xuandun_pyo3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

# ---- 代码安全扫描（CI bandit 门禁）----
# 目标：聚焦中高危真实安全风险，排除误报与工具代码
#   - exclude_dirs: benchmark 测试工具（含攻击样本文本与 subprocess 执行，非生产运行时）
#   - skips:
#       B105 枚举值 'PASS'/'WARN' 被误判为硬编码口令（types.py TrustLevel/Decision）
#       B110 捕获异常后 pass（LOW，异常风格，非直接漏洞）
#       B112 捕获异常后 continue（LOW，异常风格，非直接漏洞）
#   - 中高危项（B104 bind 0.0.0.0、B310 urlopen）已在源码用 nosec 标注人工审查理由
[tool.bandit]
targets = ["src"]
exclude_dirs = ["src/daoti_xuandun/benchmark", "build", "tests"]
skips = ["B105", "B110", "B112"]