  by_category:
    DATA: 4   # INV-01, INV-02, INV-06, INV-07
    UI: 4     # INV-03, INV-05, INV-09, INV-12
    AUTH: 2   # INV-04, INV-11
    IDEM: 1   # INV-10
    TIME: 1   # INV-08
  by_severity:
    P0: 11
    P1: 1
  by_verification:
    RUNTIME: 9
    STATIC: 3
  # 与 Sprint4 已知修复的映射
  gap_coverage:
