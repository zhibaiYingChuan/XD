# ──────────────────────────────────────────────────────────────────
# HCSE 沙箱资源限制
# ──────────────────────────────────────────────────────────────────
sandbox:
  max_memory_mb: 1024
  max_cpu_time_sec: 60
  allowed_paths:
    - "./temp"
    - "./logs"
    - "./screenshots"
    - "./evidence"
  redaction:
    cookie_value: "REDACT"
    authorization_header: "[BEARER_TOKEN_REDACTED]"
    email_pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    email_replacement: "[EMAIL_REDACTED]"
    phone_pattern: '(\+?\d{1,3}[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3,4}[-.\s]?\d{4}'
    phone_replacement: "[PHONE_REDACTED]"
