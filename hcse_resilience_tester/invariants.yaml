metadata:
  project: "道体·玄盾"
  version: "1.3.1"
  build_time: "2026-08-03 15:36:18"
  cdp_port: 9224
  page_url: "http://tauri.localhost/"
  pid: 25712
  test_date: "2026-08-03"

# -------------------------------------------------------------------
# 全局硬性约束（PHASE 6 安全沙箱）
# -------------------------------------------------------------------
sandbox:
  # 路径白名单：仅允许在此3个目录内进行文件操作
  path_whitelist:
    - "h:\\XuanDun\\temp"
    - "h:\\XuanDun\\logs"
    - "h:\\XuanDun\\cdp_artifacts_20260803"
  # 禁止访问的系统目录（命中即硬停机）
  path_blacklist:
    - "C:\\Windows\\System32"
    - "C:\\Users\\Administrator\\AppData\\Roaming\\Microsoft"
    - "\\\\?\\"
  # 资源容量上限
  max_memory_mb: 1024
  max_cpu_time_sec: 60
  max_test_duration_sec: 600

# -------------------------------------------------------------------
# 数据脱敏策略（PHASE 6 双重脱敏）
# -------------------------------------------------------------------
sanitization:
  # Cookie 字段：删除所有 value 属性
  cookie_value_redact: true
  # Authorization 头：替换为 [BEARER_TOKEN_REDACTED]
  auth_header_redact: true
  # 正则规则：在任意响应体内替换
  regex_rules:
    - pattern: "(Bearer\\s+[A-Za-z0-9\\-\\._~\\+\\/\\=]+)"
      replacement: "[BEARER_TOKEN_REDACTED]"
    - pattern: "([A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,})"
      replacement: "[EMAIL_REDACTED]"
    - pattern: "(1[3-9]\\d{9})"
      replacement: "[PHONE_REDACTED]"
    - pattern: "(webhook_url[\"']?\\s*[:=]\\s*[\"']?)(https?://[^\"'\\s]+)"
      replacement: "\\1[WEBHOOK_URL_REDACTED]"
    - pattern: "(access_token=)([A-Za-z0-9]+)"
      replacement: "\\1[ACCESS_TOKEN_REDACTED]"

# -------------------------------------------------------------------
# PHASE 1: 安全不变式定义（10条硬不变式）
# -------------------------------------------------------------------
invariants:
  - id: INV-01
    name: "页面唯一H1不变式"
    category: "UI安全"
    severity: "P0"
    description: "每个主路由页面有且仅有一个H1标签，文本符合预期"
    routes:
      "#/": "安全总览"
      "#/detect": "安全检测"
      "#/logs": "防护日志"
      "#/settings": "系统设置"
    cdp_verification: |
      Runtime.evaluate: document.querySelectorAll('h1').length === 1 &&
      document.querySelector('h1').textContent.trim() === '<expected>'
    on_violation: "hard_halt"

  - id: INV-02
    name: "ConfirmModal ARIA不变式"
    category: "可访问性"
    severity: "P0"
    description: "模态框打开时必须具备role=dialog+aria-modal=true+aria-labelledby，focus-trap生效"
    cdp_verification: |
      1. dialog元素存在 role="dialog" 属性
      2. dialog元素存在 aria-modal="true" 属性
      3. dialog元素存在 aria-labelledby 指向有效标题
      4. Tab/Shift+Tab 焦点不跳出 dialog
    on_violation: "hard_halt"

  - id: INV-03
    name: "全局异常兜底不变式"
    category: "韧性"
    severity: "P0"
    description: "未捕获异常必须被 App.tsx window error 处理器拦截，不产生 unhandledrejection"
    cdp_verification: |
      Runtime.evaluate: 注入异常后查询 window.__xuandun_error_count，
      且 Log.exceptionThrown 事件计数 = 0（被 preventDefault）
    on_violation: "hard_halt"

  - id: INV-04
    name: "引擎30s独立超时不变式"
    category: "韧性"
    severity: "P0"
    description: "send_protect_request 必须使用30s独立超时，冷启动场景不因5s默认超时失败"
    verification_mode: "source_code"  # 源码层验证 + 运行时验证
    source_evidence: "engine.rs:120-122 .timeout(Duration::from_secs(30))"
    runtime_check: "detect页面调用protect，30s内必须有响应或超时反馈，不永久卡死"
    on_violation: "hard_halt"

  - id: INV-05
    name: "子进程Drop回收不变式"
    category: "资源隔离"
    severity: "P0"
    description: "EngineState实现Drop trait，drop时kill+wait子进程，无僵尸进程"
    verification_mode: "source_code + process_list"
    source_evidence: "engine.rs:103-113 impl Drop for EngineState"
    runtime_check: "应用关闭后引擎子进程不在tasklist中"
    on_violation: "hard_halt"

  - id: INV-06
    name: "DB损坏横幅不变式"
    category: "韧性"
    severity: "P0"
    description: "xuandun:db_corrupt事件触发后3s内必须显示红色顶层横幅"
    cdp_verification: |
      window.dispatchEvent(new CustomEvent('xuandun:db_corrupt', {detail:{operation:'test',error:'db locked',hint:'重启'}}))
      3s内 DOM 必须出现包含 '数据库损坏' 的元素
    on_violation: "hard_halt"

  - id: INV-07
    name: "IPC心跳3次窗口不变式"
    category: "韧性"
    severity: "P1"
    description: "IPC心跳必须连续3次失败（30s窗口）才显示死亡横幅，单次失败不显示"
    cdp_verification: |
      模拟单次心跳失败后，ipcDead横幅不应立即出现
      （注：完整30s窗口测试受时间限制，仅验证单次失败不误报）
    on_violation: "warn"

  - id: INV-08
    name: "404路由重定向不变式"
    category: "UI安全"
    severity: "P1"
    description: "任意未匹配hash路由必须重定向到/#/，不白屏"
    cdp_verification: |
      location.hash = '#/nonexistent-xxx'
      1s后 location.hash 必须为 '#/' 或 '#'
      document.body.innerText 不为空
    on_violation: "hard_halt"

  - id: INV-09
    name: "三级文字对比度不变式"
    category: "可访问性"
    severity: "P1"
    description: "--dt-text-tertiary 必须为 #8B9DBD（4.8:1 WCAG AA）"
    cdp_verification: |
      Runtime.evaluate:
      getComputedStyle(document.documentElement).getPropertyValue('--dt-text-tertiary')
      必须包含 '8B9DBD' 或 '8b9dbd'
    on_violation: "warn"

  - id: INV-10
    name: "ConfirmModal 30s超时恢复不变式"
    category: "韧性"
    severity: "P0"
    description: "processingUI=true后30s必须自动恢复为false，防止弹窗永久卡死"
    cdp_verification: |
      触发确认按钮后强制保持processingUI=true（模拟IPC永不返回）
      31s后按钮disabled必须恢复为false
    on_violation: "hard_halt"

