[package]
name = "xuandun-desktop"
version = "1.3.4"
description = "道体玄盾 桌面安全守护"
authors = ["Daoti Team"]
edition = "2021"

[lib]
name = "xuandun_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "column_decltype"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"  # PB-10 修复：防止多实例状态不一致
tauri-plugin-updater = "2"  # v1.3.4 P1-2: 桌面端自动更新
tauri-plugin-dialog = "2"   # v1.3.4 修复: F-2 导出报告 save dialog
once_cell = "1.19"
sha2 = "0.10"
keyring = "3"
sysinfo = "0.33"
