[package]
name = "xuandun-personal"
version = "0.1.9-alpha"
description = "道体·玄盾 个人版 — 保护个人用户在使用 AI 中转站时的数据安全"
authors = ["Daoti Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xuandun_personal_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon 是 Tauri 2 的可选 feature，承载系统托盘能力。
# 不开这个 feature 则 TrayIconBuilder / TrayIconEvent 类型不存在。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
parking_lot = "0.12"
thiserror = "2"

# ── 激活码（见 src/license.rs）────────────────────────────────
# 只加这一个：SHA-256。
#   ★ 刻意**不引入** rsa / pkcs8 做验签 —— 验签放在 Python 引擎侧
#     （那里 cryptography 本就就位）。理由见 src/license.rs 顶部注释。
#     顺带的好处：引擎是编译后的二进制，比改几行 Rust 更难下手。
#   ★ 也不引入 `windows` crate 取磁盘序列号：本机网络被策略阻断
#     （证书吊销检查失败），拉不到新依赖。机器码采集放在
#     Python 侧 license.py::machine_code（调系统自带 WMI / ioreg），
#     零新增依赖且与签发工具共用同一份实现。
sha2 = "0.10"         # SHA-256（机器码哈希）

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
# 默认启用（生产构建）
default = ["custom-protocol"]
# 开发模式下禁用自定义协议（走 vite dev server）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
